<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Artes · Estúdio</title>

    <!-- Fonte & Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ============================================================
           RESET & VARIÁVEIS (mais chique)
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0b0b12;
            --bg-secondary: #111122;
            --bg-card: rgba(22, 28, 48, 0.75);
            --bg-glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-primary: #f2edf5;
            --text-secondary: rgba(242, 237, 245, 0.65);
            --text-muted: rgba(242, 237, 245, 0.30);
            --gold: #d4b86a;
            --gold-dim: rgba(212, 184, 106, 0.12);
            --gold-glow: rgba(212, 184, 106, 0.20);
            --shadow-card: 0 16px 48px rgba(0, 0, 0, 0.60);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.40);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(circle at 20% 30%, rgba(212, 184, 106, 0.03) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(212, 184, 106, 0.02) 0%, transparent 50%);
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 20px;
        }

        /* ============================================================
           LAYOUT
           ============================================================ */
        .modulo-artes {
            max-width: 1440px;
            margin: 0 auto;
            padding: 28px 32px 64px;
            position: relative;
        }

        /* ============================================================
           CABEÇALHO
           ============================================================ */
        .header-artes {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 18px 28px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-glass);
            margin-bottom: 32px;
        }

        .header-artes .titulo-modulo {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-artes .titulo-modulo i {
            font-size: 2rem;
            color: var(--gold);
            filter: drop-shadow(0 0 18px var(--gold-glow));
        }

        .header-artes .titulo-modulo h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #f2edf5 35%, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-artes .titulo-modulo span {
            font-size: 0.8rem;
            font-weight: 400;
            color: var(--text-secondary);
            -webkit-text-fill-color: var(--text-secondary);
            background: none;
            margin-left: 6px;
            letter-spacing: 0.02em;
        }

        .header-acoes {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .header-acoes .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid var(--border-glass);
            font-family: var(--font);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-glass);
            color: var(--text-primary);
            backdrop-filter: blur(6px);
            letter-spacing: 0.01em;
        }

        .header-acoes .btn:hover {
            background: var(--gold-dim);
            border-color: var(--gold);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 184, 106, 0.10);
        }

        .header-acoes .btn-primary {
            background: var(--gold);
            color: #0b0b12;
            border-color: var(--gold);
            font-weight: 600;
        }
        .header-acoes .btn-primary:hover {
            background: #e2c97a;
            border-color: #e2c97a;
            box-shadow: 0 8px 36px rgba(212, 184, 106, 0.30);
            transform: translateY(-2px);
        }

        .header-acoes .btn-sm {
            font-size: 0.75rem;
            padding: 6px 16px;
        }

        /* ============================================================
           TABS
           ============================================================ */
        .tabs-artes {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-bottom: 32px;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 4px;
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(6px);
        }

        .tabs-artes .tab-btn {
            flex: 0 0 auto;
            padding: 10px 28px;
            border: none;
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.01em;
        }

        .tabs-artes .tab-btn i {
            font-size: 0.95rem;
        }

        .tabs-artes .tab-btn:hover {
            color: var(--text-primary);
            background: var(--bg-glass);
        }

        .tabs-artes .tab-btn.ativo {
            background: var(--gold-dim);
            color: var(--gold);
            box-shadow: 0 0 30px rgba(212, 184, 106, 0.04);
        }

        /* ============================================================
           PAINÉIS
           ============================================================ */
        .painel {
            display: none;
            animation: fadePainel 0.5s ease;
        }

        .painel.ativo {
            display: block;
        }

        @keyframes fadePainel {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           EXPOSIÇÃO — CINEMATOGRÁFICA
           ============================================================ */
        .exposicao-grid {
            display: flex;
            flex-direction: column;
            gap: 36px;
        }

        .expo-card {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            transition: var(--transition);
            cursor: pointer;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-card);
        }

        .expo-card:hover {
            transform: scale(1.01);
            border-color: var(--gold);
            box-shadow: 0 24px 72px rgba(0, 0, 0, 0.65);
            z-index: 2;
        }

        .expo-card .slideshow {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .expo-card .slideshow .slide-track {
            display: flex;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            will-change: transform;
        }

        .expo-card .slideshow .slide-track .slide {
            flex: 0 0 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-color: var(--bg-secondary);
        }

        .expo-card .slideshow .slide-track .slide .no-image {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: var(--bg-secondary);
            color: var(--text-muted);
            font-size: 1.2rem;
            flex-direction: column;
            gap: 12px;
        }

        .expo-card .slideshow .slide-track .slide .no-image i {
            font-size: 3.5rem;
            opacity: 0.15;
        }

        .expo-card .slideshow .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(11, 11, 18, 0.60);
            border: none;
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: var(--transition);
            z-index: 5;
            opacity: 0;
            pointer-events: none;
        }

        .expo-card:hover .slideshow .nav-btn {
            opacity: 1;
            pointer-events: auto;
        }

        .expo-card .slideshow .nav-btn:hover {
            background: var(--gold);
            color: #0b0b12;
            border-color: var(--gold);
            transform: translateY(-50%) scale(1.05);
        }

        .expo-card .slideshow .nav-btn.prev {
            left: 16px;
        }
        .expo-card .slideshow .nav-btn.next {
            right: 16px;
        }

        .expo-card .slideshow .indicators {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 5;
            background: rgba(11, 11, 18, 0.40);
            padding: 8px 16px;
            border-radius: 40px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .expo-card .slideshow .indicators .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            padding: 0;
            cursor: pointer;
            transition: var(--transition);
        }

        .expo-card .slideshow .indicators .dot.active {
            background: var(--gold);
            box-shadow: 0 0 16px var(--gold-glow);
            width: 24px;
            border-radius: 4px;
        }

        .expo-card .slideshow .indicators .dot:hover {
            background: rgba(255, 255, 255, 0.40);
        }

        .expo-card .legenda {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 28px 36px 32px;
            pointer-events: none;
            z-index: 3;
            background: linear-gradient(to top, rgba(11, 11, 18, 0.70) 0%, transparent 100%);
        }

        .expo-card .legenda .titulo {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
            text-shadow: 0 4px 30px rgba(0, 0, 0, 0.60);
        }

        .expo-card .legenda .meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 24px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.50);
        }

        .expo-card .legenda .meta .status-badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 3px 16px;
            border-radius: 40px;
            background: rgba(11, 11, 18, 0.50);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            backdrop-filter: blur(4px);
        }

        .expo-card .legenda .meta .status-badge.finalizada {
            background: rgba(76, 201, 120, 0.12);
            border-color: rgba(76, 201, 120, 0.20);
            color: #7ae0a0;
        }
        .expo-card .legenda .meta .status-badge.producao {
            background: rgba(212, 184, 106, 0.12);
            border-color: rgba(212, 184, 106, 0.18);
            color: var(--gold);
        }
        .expo-card .legenda .meta .status-badge.planejada {
            background: rgba(76, 150, 201, 0.10);
            border-color: rgba(76, 150, 201, 0.16);
            color: #7ac0db;
        }
        .expo-card .legenda .meta .status-badge.ideia {
            background: rgba(150, 150, 180, 0.06);
            border-color: rgba(150, 150, 180, 0.10);
            color: var(--text-muted);
        }
        .expo-card .legenda .meta .status-badge.revisao {
            background: rgba(201, 130, 76, 0.12);
            border-color: rgba(201, 130, 76, 0.18);
            color: #db9a6b;
        }

        .expo-card .legenda .meta .tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .expo-card .legenda .meta .tags span {
            font-size: 0.65rem;
            opacity: 0.6;
            background: rgba(0, 0, 0, 0.25);
            padding: 0 10px;
            border-radius: 20px;
            backdrop-filter: blur(2px);
        }

        /* ============================================================
           PIPELINE — STATS
           ============================================================ */
        .pipeline-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 18px;
            margin-bottom: 36px;
        }

        .stat-card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            padding: 20px 24px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.25;
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(212, 184, 106, 0.20);
            box-shadow: var(--shadow-soft);
        }

        .stat-card .rotulo {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stat-card .valor {
            font-size: 2.2rem;
            font-weight: 700;
            margin-top: 4px;
            line-height: 1.2;
        }

        .stat-card .valor.dourado {
            color: var(--gold);
        }

        .stat-card .sub {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* ============================================================
           PIPELINE — KANBAN
           ============================================================ */
        .pipeline-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .pipeline-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pipeline-header h2 i {
            color: var(--gold);
        }

        .pipeline-header .btn {
            padding: 10px 24px;
            border-radius: 40px;
            border: none;
            font-family: var(--font);
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            background: var(--gold);
            color: #0b0b12;
            border: 1px solid var(--gold);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .pipeline-header .btn:hover {
            background: #e2c97a;
            box-shadow: 0 8px 36px rgba(212, 184, 106, 0.25);
            transform: translateY(-2px);
        }

        .kanban-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
            margin-top: 8px;
        }

        .kanban-coluna {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-glass);
            padding: 16px 14px 20px;
            min-height: 320px;
            backdrop-filter: blur(6px);
            transition: var(--transition);
        }

        .kanban-coluna .coluna-titulo {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-secondary);
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .kanban-coluna .coluna-titulo .contagem {
            background: var(--bg-glass);
            padding: 0 12px;
            border-radius: 40px;
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .kanban-coluna .coluna-body {
            min-height: 180px;
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .kanban-coluna .coluna-body .texto-vazio {
            padding: 20px 0;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            font-style: italic;
        }

        .kanban-card {
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            border: 1px solid var(--border-glass);
            cursor: grab;
            transition: var(--transition);
            user-select: none;
            position: relative;
        }

        .kanban-card:hover {
            border-color: rgba(212, 184, 106, 0.20);
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
        }

        .kanban-card:active {
            cursor: grabbing;
        }

        .kanban-card .card-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .kanban-card .card-top .thumb {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: var(--bg-card);
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .kanban-card .card-top .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .kanban-card .card-top .thumb i {
            font-size: 1.1rem;
            color: var(--text-muted);
            opacity: 0.3;
        }

        .kanban-card .card-top .card-nome {
            font-weight: 500;
            font-size: 0.85rem;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .kanban-card .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        .kanban-card .card-footer .progresso-bar {
            flex: 1;
            height: 3px;
            background: var(--bg-card);
            border-radius: 4px;
            margin-right: 12px;
            overflow: hidden;
        }

        .kanban-card .card-footer .progresso-bar .preenchido {
            height: 100%;
            background: var(--gold);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .kanban-card .card-footer .progresso-texto {
            font-weight: 500;
            min-width: 32px;
            text-align: right;
        }

        .kanban-card.dragging {
            opacity: 0.3;
            transform: scale(0.95);
        }

        .kanban-coluna.drag-over {
            border-color: var(--gold);
            background: var(--gold-dim);
            box-shadow: inset 0 0 60px rgba(212, 184, 106, 0.04);
        }

        /* ============================================================
           MODAIS
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.70);
            backdrop-filter: blur(18px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
            animation: fadeModal 0.3s ease;
        }

        .modal-overlay.aberto {
            display: flex;
        }

        @keyframes fadeModal {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-conteudo {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius);
            max-width: 780px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 36px 40px;
            box-shadow: 0 32px 96px rgba(0, 0, 0, 0.75);
            position: relative;
        }

        .modal-conteudo::-webkit-scrollbar {
            width: 4px;
        }
        .modal-conteudo::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 8px;
        }

        .modal-conteudo .fechar-modal {
            position: absolute;
            top: 18px;
            right: 22px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-conteudo .fechar-modal:hover {
            color: var(--text-primary);
            transform: rotate(90deg) scale(1.05);
        }

        .modal-conteudo h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 24px;
            letter-spacing: -0.02em;
        }

        .modal-conteudo h2 i {
            color: var(--gold);
            margin-right: 12px;
        }

        .modal-conteudo .grupo {
            margin-bottom: 20px;
        }

        .modal-conteudo .grupo label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .modal-conteudo .grupo input,
        .modal-conteudo .grupo select,
        .modal-conteudo .grupo textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 0.9rem;
            transition: var(--transition);
            outline: none;
        }

        .modal-conteudo .grupo input:focus,
        .modal-conteudo .grupo select:focus,
        .modal-conteudo .grupo textarea:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 184, 106, 0.08);
        }

        .modal-conteudo .grupo textarea {
            min-height: 80px;
            resize: vertical;
        }

        .modal-conteudo .grupo .linha-dupla {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .modal-conteudo .grupo .checkbox-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 20px;
        }

        .modal-conteudo .grupo .checkbox-grid label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            text-transform: none;
            letter-spacing: 0;
            font-size: 0.82rem;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .modal-conteudo .grupo .checkbox-grid input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: var(--gold);
            cursor: pointer;
        }

        .modal-conteudo .grupo .links-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .modal-conteudo .grupo .links-group input {
            font-size: 0.8rem;
        }

        .upload-area {
            border: 2px dashed var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-muted);
        }

        .upload-area:hover {
            border-color: var(--gold);
            background: var(--gold-dim);
        }

        .upload-area i {
            font-size: 2.2rem;
            display: block;
            margin-bottom: 10px;
            opacity: 0.3;
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .preview-imagens {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-top: 14px;
        }

        .preview-imagens .mini {
            width: 84px;
            height: 84px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-glass);
            background: var(--bg-card);
            position: relative;
        }

        .preview-imagens .mini img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-imagens .mini .remover {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.70);
            border: none;
            color: #fff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            font-size: 0.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .preview-imagens .mini .remover:hover {
            background: #c0392b;
            transform: scale(1.1);
        }

        .modal-conteudo .acoes-modal {
            display: flex;
            justify-content: flex-end;
            gap: 14px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid var(--border-glass);
        }

        .modal-conteudo .acoes-modal .btn {
            padding: 12px 32px;
            border-radius: 40px;
            border: none;
            font-family: var(--font);
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .modal-conteudo .acoes-modal .btn-cancelar {
            background: var(--bg-glass);
            color: var(--text-secondary);
            border: 1px solid var(--border-glass);
        }

        .modal-conteudo .acoes-modal .btn-cancelar:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .modal-conteudo .acoes-modal .btn-salvar {
            background: var(--gold);
            color: #0b0b12;
            border: 1px solid var(--gold);
            font-weight: 600;
        }

        .modal-conteudo .acoes-modal .btn-salvar:hover {
            background: #e2c97a;
            box-shadow: 0 8px 36px rgba(212, 184, 106, 0.25);
        }

        /* ============================================================
           MODAL DETALHE
           ============================================================ */
        .modal-detalhe .modal-conteudo {
            max-width: 880px;
            padding: 32px 36px;
        }

        .modal-detalhe .detalhe-topo {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .modal-detalhe .detalhe-topo .img-principal {
            flex: 0 0 240px;
            aspect-ratio: 16/11;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-detalhe .detalhe-topo .img-principal img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-detalhe .detalhe-topo .img-principal i {
            font-size: 3.5rem;
            color: var(--text-muted);
            opacity: 0.15;
        }

        .modal-detalhe .detalhe-topo .info-principal {
            flex: 1;
            min-width: 180px;
        }

        .modal-detalhe .detalhe-topo .info-principal .nome {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .modal-detalhe .detalhe-topo .info-principal .categoria {
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: 2px;
        }

        .modal-detalhe .detalhe-topo .info-principal .descricao {
            margin-top: 12px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .modal-detalhe .detalhe-topo .info-principal .status-badge {
            display: inline-block;
            margin-top: 12px;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 4px 18px;
            border-radius: 40px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
        }

        .modal-detalhe .detalhe-topo .info-principal .status-badge.finalizada {
            background: rgba(76, 201, 120, 0.10);
            border-color: rgba(76, 201, 120, 0.16);
            color: #7ae0a0;
        }

        .modal-detalhe .detalhe-topo .info-principal .status-badge.producao {
            background: rgba(212, 184, 106, 0.10);
            border-color: rgba(212, 184, 106, 0.16);
            color: var(--gold);
        }

        .modal-detalhe .detalhe-topo .info-principal .status-badge.planejada {
            background: rgba(76, 150, 201, 0.10);
            border-color: rgba(76, 150, 201, 0.16);
            color: #7ac0db;
        }

        .modal-detalhe .detalhe-topo .info-principal .status-badge.ideia {
            background: rgba(150, 150, 180, 0.06);
            border-color: rgba(150, 150, 180, 0.10);
            color: var(--text-muted);
        }

        .modal-detalhe .detalhe-topo .info-principal .status-badge.revisao {
            background: rgba(201, 130, 76, 0.10);
            border-color: rgba(201, 130, 76, 0.16);
            color: #db9a6b;
        }

        .modal-detalhe .detalhe-galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 14px;
            margin: 18px 0 22px;
        }

        .modal-detalhe .detalhe-galeria .img-thumb {
            aspect-ratio: 1/1;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border-glass);
        }

        .modal-detalhe .detalhe-galeria .img-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }

        .modal-detalhe .detalhe-galeria .img-thumb img:hover {
            transform: scale(1.03);
        }

        .modal-detalhe .detalhe-info-extra {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin: 18px 0 22px;
            padding: 18px 20px;
            background: var(--bg-card);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-glass);
        }

        .modal-detalhe .detalhe-info-extra .item {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .modal-detalhe .detalhe-info-extra .item strong {
            display: block;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.85rem;
        }

        .modal-detalhe .detalhe-etapas {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 16px;
            margin: 10px 0 16px;
        }

        .modal-detalhe .detalhe-etapas .etapa {
            font-size: 0.7rem;
            padding: 3px 14px;
            border-radius: 40px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
        }

        .modal-detalhe .detalhe-etapas .etapa.concluida {
            background: rgba(76, 201, 120, 0.08);
            border-color: rgba(76, 201, 120, 0.12);
            color: #7ae0a0;
        }

        .modal-detalhe .detalhe-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            margin-top: 14px;
        }

        .modal-detalhe .detalhe-links a {
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition);
            border-bottom: 1px solid transparent;
        }

        .modal-detalhe .detalhe-links a:hover {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }

        .modal-detalhe .detalhe-referencias {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .modal-detalhe .detalhe-referencias .ref-tag {
            padding: 3px 16px;
            border-radius: 40px;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            padding: 16px 28px;
            box-shadow: 0 16px 56px rgba(0, 0, 0, 0.60);
            font-size: 0.85rem;
            color: var(--text-primary);
            z-index: 2000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.45s ease;
            pointer-events: none;
        }

        .toast.visivel {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .toast i {
            color: var(--gold);
            margin-right: 12px;
        }

        /* ============================================================
           RESPONSIVIDADE
           ============================================================ */
        @media (max-width: 820px) {
            .modulo-artes {
                padding: 18px 18px 40px;
            }
            .header-artes .titulo-modulo h1 {
                font-size: 1.4rem;
            }
            .header-acoes .btn span {
                display: none;
            }
            .modal-conteudo {
                padding: 24px 20px;
            }
            .modal-conteudo .grupo .linha-dupla,
            .modal-conteudo .grupo .links-group {
                grid-template-columns: 1fr;
            }
            .modal-detalhe .detalhe-topo .img-principal {
                flex: 0 0 100%;
                aspect-ratio: 16/10;
            }
            .kanban-container {
                grid-template-columns: 1fr 1fr;
            }
            .pipeline-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .expo-card .legenda .titulo {
                font-size: 1.5rem;
            }
            .expo-card .slideshow .nav-btn {
                width: 36px;
                height: 36px;
                opacity: 1;
                background: rgba(11, 11, 18, 0.70);
            }
            .expo-card .legenda {
                padding: 20px 24px 24px;
            }
            .modal-detalhe .modal-conteudo {
                padding: 24px 18px;
            }
        }

        @media (max-width: 500px) {
            .kanban-container {
                grid-template-columns: 1fr;
            }
            .pipeline-stats {
                grid-template-columns: 1fr 1fr;
            }
            .tabs-artes .tab-btn {
                font-size: 0.7rem;
                padding: 8px 14px;
            }
            .tabs-artes .tab-btn span {
                display: none;
            }
            .modal-conteudo {
                padding: 18px 14px;
            }
            .header-artes {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-acoes {
                width: 100%;
            }
            .header-acoes .btn {
                flex: 1;
                justify-content: center;
            }
            .expo-card .legenda .titulo {
                font-size: 1.1rem;
            }
            .expo-card .legenda .meta {
                font-size: 0.7rem;
                gap: 6px 12px;
            }
            .expo-card .slideshow .nav-btn {
                width: 30px;
                height: 30px;
                font-size: 0.7rem;
            }
            .expo-card .slideshow .indicators .dot {
                width: 6px;
                height: 6px;
            }
            .expo-card .slideshow .indicators .dot.active {
                width: 16px;
            }
            .expo-card .legenda {
                padding: 14px 16px 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    MÓDULO ARTES
    ============================================================ -->
    <div class="modulo-artes" id="appArtes">

        <!-- CABEÇALHO -->
        <header class="header-artes">
            <div class="titulo-modulo">
                <i class="fas fa-palette"></i>
                <h1>Artes <span>· estúdio</span></h1>
            </div>
            <div class="header-acoes">
                <button class="btn btn-sm" id="btnExportar" title="Exportar dados">
                    <i class="fas fa-download"></i> <span>Exportar</span>
                </button>
                <button class="btn btn-sm" id="btnImportar" title="Importar dados">
                    <i class="fas fa-upload"></i> <span>Importar</span>
                </button>
                <input type="file" id="inputImportar" accept=".json" style="display:none" />
            </div>
        </header>

        <!-- TABS -->
        <nav class="tabs-artes" role="tablist">
            <button class="tab-btn ativo" data-tab="exposicao"><i class="fas fa-images"></i> <span>Visão Geral</span></button>
            <button class="tab-btn" data-tab="pipeline"><i class="fas fa-table-columns"></i> <span>Pipeline</span></button>
        </nav>

        <!-- ============================================================
        PAINEL 1 — EXPOSIÇÃO
        ============================================================ -->
        <section class="painel ativo" id="painel-exposicao">
            <div class="exposicao-grid" id="exposicaoGrid">
                <!-- preenchido via JS -->
            </div>
        </section>

        <!-- ============================================================
        PAINEL 2 — PIPELINE
        ============================================================ -->
        <section class="painel" id="painel-pipeline">

            <!-- Estatísticas -->
            <div class="pipeline-stats" id="pipelineStats">
                <div class="stat-card">
                    <div class="rotulo">Total</div>
                    <div class="valor" id="statTotal">0</div>
                    <div class="sub">artes registradas</div>
                </div>
                <div class="stat-card">
                    <div class="rotulo">Concluídas</div>
                    <div class="valor dourado" id="statConcluidas">0</div>
                    <div class="sub">finalizadas</div>
                </div>
                <div class="stat-card">
                    <div class="rotulo">Em produção</div>
                    <div class="valor" id="statProducao">0</div>
                    <div class="sub">andamento</div>
                </div>
                <div class="stat-card">
                    <div class="rotulo">Planejadas</div>
                    <div class="valor" id="statPlanejadas">0</div>
                    <div class="sub">a fazer</div>
                </div>
                <div class="stat-card">
                    <div class="rotulo">Progresso</div>
                    <div class="valor" id="statProgresso">0%</div>
                    <div class="sub">médio geral</div>
                </div>
            </div>

            <!-- Kanban -->
            <div class="pipeline-header">
                <h2><i class="fas fa-table-columns"></i>Pipeline de produção</h2>
                <button class="btn" id="btnNovaArte"><i class="fas fa-plus"></i> Nova Arte</button>
            </div>
            <div class="kanban-container" id="kanbanContainer">
                <!-- colunas geradas via JS -->
            </div>
        </section>

    </div>

    <!-- ============================================================
    MODAL — NOVA ARTE / EDIÇÃO
    ============================================================ -->
    <div class="modal-overlay" id="modalArte">
        <div class="modal-conteudo">
            <button class="fechar-modal" id="fecharModalArte"><i class="fas fa-times"></i></button>
            <h2 id="modalArteTitulo"><i class="fas fa-pen-fancy"></i> Nova Arte</h2>

            <form id="formArte" autocomplete="off">
                <input type="hidden" id="arteId" />

                <div class="grupo">
                    <label>Nome da arte</label>
                    <input type="text" id="fNome" placeholder="Ex: Farol abandonado" required />
                </div>

                <div class="grupo">
                    <label>Categoria</label>
                    <select id="fCategoria">
                        <option value="Concept Art">Concept Art</option>
                        <option value="Personagem">Personagem</option>
                        <option value="NPC">NPC</option>
                        <option value="Cenário">Cenário</option>
                        <option value="Local">Local</option>
                        <option value="Objeto">Objeto</option>
                        <option value="Interface">Interface</option>
                        <option value="Sprite">Sprite</option>
                        <option value="Animação">Animação</option>
                        <option value="Cutscene">Cutscene</option>
                        <option value="Ilustração">Ilustração</option>
                        <option value="Outro">Outro</option>
                    </select>
                </div>

                <div class="grupo">
                    <label>Descrição</label>
                    <textarea id="fDescricao" placeholder="Descreva a arte, seu propósito e contexto..."></textarea>
                </div>

                <div class="grupo">
                    <label>Objetivo da arte</label>
                    <input type="text" id="fObjetivo" placeholder="Ex: Estabelecer a atmosfera do farol" />
                </div>

                <div class="grupo">
                    <label>Importância para o jogo</label>
                    <input type="text" id="fImportancia" placeholder="Ex: Peça-chave para a identidade visual" />
                </div>

                <div class="grupo">
                    <div class="linha-dupla">
                        <div>
                            <label>Status</label>
                            <select id="fStatus">
                                <option value="Ideia">Ideia</option>
                                <option value="Planejada">Planejada</option>
                                <option value="Em produção">Em produção</option>
                                <option value="Revisão">Revisão</option>
                                <option value="Finalizada">Finalizada</option>
                            </select>
                        </div>
                        <div>
                            <label>Progresso <span id="progressoLabel">0%</span></label>
                            <input type="range" id="fProgresso" min="0" max="100" value="0" style="width:100%;accent-color:var(--gold);" />
                        </div>
                    </div>
                </div>

                <div class="grupo">
                    <label>Etapas da produção</label>
                    <div class="checkbox-grid" id="etapasCheckbox">
                        <label><input type="checkbox" value="Pesquisa" /> Pesquisa</label>
                        <label><input type="checkbox" value="Referências" /> Referências</label>
                        <label><input type="checkbox" value="Rascunho" /> Rascunho</label>
                        <label><input type="checkbox" value="Concept inicial" /> Concept inicial</label>
                        <label><input type="checkbox" value="Refinamento" /> Refinamento</label>
                        <label><input type="checkbox" value="Colorização" /> Colorização</label>
                        <label><input type="checkbox" value="Finalização" /> Finalização</label>
                        <label><input type="checkbox" value="Exportação" /> Exportação</label>
                    </div>
                </div>

                <div class="grupo">
                    <label>Links</label>
                    <div class="links-group">
                        <input type="url" id="fLinkArte" placeholder="Link da arte" />
                        <input type="url" id="fLinkDrive" placeholder="Link do Drive" />
                        <input type="url" id="fLinkFigma" placeholder="Link do Figma" />
                        <input type="url" id="fLinkPinterest" placeholder="Link do Pinterest" />
                        <input type="url" id="fLinkReferencia" placeholder="Link de referência" />
                    </div>
                </div>

                <div class="grupo">
                    <label>Imagens (múltiplas)</label>
                    <div class="upload-area" id="uploadArea">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>Clique para selecionar imagens ou arraste</span>
                        <input type="file" id="fImagens" accept="image/*" multiple />
                    </div>
                    <div class="preview-imagens" id="previewImagens"></div>
                </div>

                <div class="grupo">
                    <label>Tags (separadas por vírgula)</label>
                    <input type="text" id="fTags" placeholder="Ex: farol, mar, atmosfera, noite" />
                </div>

                <div class="grupo">
                    <div class="linha-dupla">
                        <div>
                            <label>Software usado</label>
                            <input type="text" id="fSoftware" placeholder="Ex: Photoshop, Blender" />
                        </div>
                        <div>
                            <label>Artista responsável</label>
                            <input type="text" id="fArtista" placeholder="Nome do artista" />
                        </div>
                    </div>
                </div>

                <div class="grupo">
                    <label>Observações</label>
                    <textarea id="fObservacoes" placeholder="Observações adicionais..."></textarea>
                </div>

                <div class="acoes-modal">
                    <button type="button" class="btn btn-cancelar" id="cancelarModalArte">Cancelar</button>
                    <button type="submit" class="btn btn-salvar"><i class="fas fa-check"></i> Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ============================================================
    MODAL — DETALHE
    ============================================================ -->
    <div class="modal-overlay modal-detalhe" id="modalDetalhe">
        <div class="modal-conteudo">
            <button class="fechar-modal" id="fecharModalDetalhe"><i class="fas fa-times"></i></button>
            <div id="detalheConteudo">
                <!-- preenchido via JS -->
            </div>
        </div>
    </div>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div class="toast" id="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">Salvo!</span></div>

    <!-- ============================================================
    SCRIPT
    ============================================================ -->
    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIG
            // ============================================================
            const STORAGE_KEY = 'artes_estudio_data';

            // ============================================================
            // DADOS INICIAIS
            // ============================================================
            const DADOS_INICIAIS = [{
                id: 'art_001',
                nome: 'Farol Abandonado',
                categoria: 'Cenário',
                descricao: 'Farol em ruínas à beira de um penhasco, envolto em névoa e clima de suspense.',
                objetivo: 'Estabelecer a atmosfera melancólica do primeiro ato.',
                importancia: 'Peça-chave para a identidade visual do jogo.',
                status: 'Finalizada',
                progresso: 100,
                etapas: ['Pesquisa', 'Referências', 'Rascunho', 'Concept inicial', 'Refinamento', 'Colorização',
                    'Finalização', 'Exportação'
