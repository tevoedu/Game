            // ============================================================
            // UTILITÁRIOS
            // ============================================================
            function uid() {
                return Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
            }

            function salvarToast(msg, icone = 'fa-check-circle') {
                toastMsg.textContent = msg;
                toast.querySelector('i').className = 'fas ' + icone;
                toast.classList.add('visivel');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => toast.classList.remove('visivel'), 2800);
            }

            function gerarCorStatus(status) {
                const mapa = {
                    'Finalizada': 'finalizada',
                    'Em produção': 'producao',
                    'Planejada': 'planejada',
                    'Ideia': 'ideia',
                    'Revisão': 'revisao'
                };
                return mapa[status] || '';
            }

            function formatarData(d) {
                if (!d) return '—';
                const partes = d.split('-');
                if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
                return d;
            }

            function getEtapasFromCheckboxes() {
                const checks = etapasCheckbox.querySelectorAll('input[type="checkbox"]:checked');
                return Array.from(checks).map(el => el.value);
            }

            function setEtapasCheckboxes(valores) {
                const checks = etapasCheckbox.querySelectorAll('input[type="checkbox"]');
                checks.forEach(el => {
                    el.checked = valores.includes(el.value);
                });
            }

            function extrairTags(str) {
                return str.split(',').map(s => s.trim()).filter(Boolean);
            }

            // ============================================================
            // ARMAZENAMENTO
            // ============================================================
            function carregarDados() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        if (Array.isArray(parsed) && parsed.length) {
                            artes = parsed;
                            return;
                        }
                    }
                } catch (_) { /* ignore */ }
                artes = JSON.parse(JSON.stringify(DADOS_INICIAIS));
                salvarDados();
            }

            function salvarDados() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(artes));
                } catch (_) { /* ignore */ }
            }

            function exportarDados() {
                const blob = new Blob([JSON.stringify(artes, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `artes_export_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                salvarToast('Dados exportados com sucesso!', 'fa-download');
            }

            function importarDados(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const dados = JSON.parse(e.target.result);
                        if (Array.isArray(dados)) {
                            artes = dados;
                            salvarDados();
                            renderizarTudo();
                            salvarToast('Dados importados com sucesso!', 'fa-upload');
                        } else {
                            salvarToast('Arquivo inválido.', 'fa-exclamation-triangle');
                        }
                    } catch (_) {
                        salvarToast('Erro ao ler o arquivo.', 'fa-exclamation-triangle');
                    }
                };
                reader.readAsText(file);
            }

            // ============================================================
            // CRUD
            // ============================================================
            function criarArte(dados) {
                const nova = {
                    id: uid(),
                    nome: dados.nome || 'Sem nome',
                    categoria: dados.categoria || 'Outro',
                    descricao: dados.descricao || '',
                    objetivo: dados.objetivo || '',
                    importancia: dados.importancia || '',
                    status: dados.status || 'Ideia',
                    progresso: Number(dados.progresso) || 0,
                    etapas: dados.etapas || [],
                    links: {
                        arte: dados.linkArte || '',
                        drive: dados.linkDrive || '',
                        figma: dados.linkFigma || '',
                        pinterest: dados.linkPinterest || '',
                        referencia: dados.linkReferencia || ''
                    },
                    imagens: dados.imagens || [],
                    software: dados.software || '',
                    artista: dados.artista || '',
                    dataCriacao: dados.dataCriacao || new Date().toISOString().slice(0, 10),
                    observacoes: dados.observacoes || '',
                    tags: dados.tags || [],
                    referencias: dados.referencias || [],
                    historico: dados.historico || [`${new Date().toISOString().slice(0,10)}: Criado`]
                };
                artes.unshift(nova);
                salvarDados();
                return nova;
            }

            function atualizarArte(id, dados) {
                const idx = artes.findIndex(a => a.id === id);
                if (idx === -1) return null;
                const existente = artes[idx];
                const atualizada = {
                    ...existente,
                    nome: dados.nome || existente.nome,
                    categoria: dados.categoria || existente.categoria,
                    descricao: dados.descricao !== undefined ? dados.descricao : existente.descricao,
                    objetivo: dados.objetivo !== undefined ? dados.objetivo : existente.objetivo,
                    importancia: dados.importancia !== undefined ? dados.importancia : existente.importancia,
                    status: dados.status || existente.status,
                    progresso: Number(dados.progresso) !== undefined ? Number(dados.progresso) : existente.progresso,
                    etapas: dados.etapas || existente.etapas,
                    links: {
                        ...existente.links,
                        arte: dados.linkArte !== undefined ? dados.linkArte : existente.links.arte,
                        drive: dados.linkDrive !== undefined ? dados.linkDrive : existente.links.drive,
                        figma: dados.linkFigma !== undefined ? dados.linkFigma : existente.links.figma,
                        pinterest: dados.linkPinterest !== undefined ? dados.linkPinterest : existente.links.pinterest,
                        referencia: dados.linkReferencia !== undefined ? dados.linkReferencia : existente.links
                        .referencia
                    },
                    imagens: dados.imagens !== undefined ? dados.imagens : existente.imagens,
                    software: dados.software !== undefined ? dados.software : existente.software,
                    artista: dados.artista !== undefined ? dados.artista : existente.artista,
                    observacoes: dados.observacoes !== undefined ? dados.observacoes : existente.observacoes,
                    tags: dados.tags || existente.tags,
                    referencias: dados.referencias || existente.referencias,
                    historico: dados.historico || existente.historico
                };
                artes[idx] = atualizada;
                salvarDados();
                return atualizada;
            }

            function removerArte(id) {
                artes = artes.filter(a => a.id !== id);
                salvarDados();
            }

            function obterArte(id) {
                return artes.find(a => a.id === id) || null;
            }

            // ============================================================
            // RENDERIZAÇÃO: EXPOSIÇÃO
            // ============================================================
            function renderizarExposicao() {
                if (!artes.length) {
                    exposicaoGrid.innerHTML = `
                <div style="text-align:center;padding:80px 20px;color:var(--text-muted);">
                  <i class="fas fa-paintbrush" style="font-size:3.5rem;opacity:0.15;display:block;margin-bottom:16px;"></i>
                  <p style="font-size:1.2rem;font-weight:300;">Nenhuma arte cadastrada.</p>
                  <p style="font-size:0.9rem;opacity:0.6;">Vá para o <strong style="color:var(--gold);">Pipeline</strong> e crie sua primeira obra!</p>
                </div>
              `;
                    return;
                }

                exposicaoGrid.innerHTML = artes.map(arte => {
                    const imagens = arte.imagens && arte.imagens.length ? arte.imagens : [];
                    const total = imagens.length;
                    const statusCls = gerarCorStatus(arte.status);

                    let slidesHtml = '';
                    if (total === 0) {
                        slidesHtml = `
                  <div class="slide">
                    <div class="no-image">
                      <i class="fas fa-image"></i>
                      <span>Sem imagem</span>
                    </div>
                  </div>
                `;
                    } else {
                        slidesHtml = imagens.map(img => `
                  <div class="slide" style="background-image: url('${img}');"></div>
                `).join('');
                    }

                    let indicatorsHtml = '';
                    if (total > 1) {
                        for (let i = 0; i < total; i++) {
                            indicatorsHtml += `<button class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></button>`;
                        }
                    }

                    const navHtml = total > 1 ? `
                <button class="nav-btn prev"><i class="fas fa-chevron-left"></i></button>
                <button class="nav-btn next"><i class="fas fa-chevron-right"></i></button>
                <div class="indicators">${indicatorsHtml}</div>
              ` : '';

                    return `
                <div class="expo-card" data-id="${arte.id}">
                  <div class="slideshow" data-total="${total}">
                    <div class="slide-track" style="transform: translateX(0%);">
                      ${slidesHtml}
                    </div>
                    ${navHtml}
                  </div>
                  <div class="legenda">
                    <div class="titulo">${arte.nome}</div>
                    <div class="meta">
                      <span>${arte.categoria}</span>
                      <span class="status-badge ${statusCls}">${arte.status}</span>
                      ${arte.tags && arte.tags.length ? `<div class="tags">${arte.tags.slice(0,3).map(t => `<span>#${t}</span>`).join('')}</div>` : ''}
                    </div>
                  </div>
                </div>
              `;
                }).join('');

                exposicaoGrid.querySelectorAll('.expo-card').forEach(card => {
                    const slideshow = card.querySelector('.slideshow');
                    if (!slideshow) return;
                    const track = slideshow.querySelector('.slide-track');
                    const total = parseInt(slideshow.dataset.total, 10);
                    if (total <= 1) return;

                    let current = 0;
                    const dots = slideshow.querySelectorAll('.dot');
                    const prevBtn = slideshow.querySelector('.prev');
                    const nextBtn = slideshow.querySelector('.next');

                    function goTo(index) {
                        if (index < 0) index = total - 1;
                        if (index >= total) index = 0;
                        current = index;
                        track.style.transform = `translateX(-${current * 100}%)`;
                        dots.forEach((dot, i) => {
                            dot.classList.toggle('active', i === current);
                        });
                    }

                    prevBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        goTo(current - 1);
                    });
                    nextBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        goTo(current + 1);
                    });
                    dots.forEach((dot, i) => {
                        dot.addEventListener('click', (e) => {
                            e.stopPropagation();
                            goTo(i);
                        });
                    });

                    card.addEventListener('click', (e) => {
                        if (e.target.closest('.nav-btn') || e.target.closest('.dot')) return;
                        const id = card.dataset.id;
                        if (id) abrirDetalhe(id);
                    });
                });
            }

            // ============================================================
            // RENDERIZAÇÃO: PIPELINE
            // ============================================================
            function renderizarStats() {
                const total = artes.length;
                const concluidas = artes.filter(a => a.status === 'Finalizada').length;
                const producao = artes.filter(a => a.status === 'Em produção').length;
                const planejadas = artes.filter(a => a.status === 'Planejada').length;
                const progressoMedio = total > 0 ? Math.round(artes.reduce((acc, a) => acc + a.progresso, 0) / total) : 0;

                stats.total.textContent = total;
                stats.concluidas.textContent = concluidas;
                stats.producao.textContent = producao;
                stats.planejadas.textContent = planejadas;
                stats.progresso.textContent = progressoMedio + '%';
            }

            const COLUNAS_KANBAN = [
                { id: 'Ideia', label: '💡 Ideias' },
                { id: 'Planejada', label: '📋 Planejamento' },
                { id: 'Em produção', label: '⚙️ Produção' },
                { id: 'Revisão', label: '🔍 Revisão' },
                { id: 'Finalizada', label: '✅ Finalizadas' }
            ];

            function renderizarKanban() {
                kanbanContainer.innerHTML = COLUNAS_KANBAN.map(col => {
                    const itens = artes.filter(a => a.status === col.id);
                    const bodyHtml = itens.length ?
                        itens.map(arte => kanbanCardHTML(arte)).join('') :
                        `<div class="texto-vazio">— vazio —</div>`;

                    return `
                <div class="kanban-coluna" data-status="${col.id}" data-coluna="${col.id}">
                  <div class="coluna-titulo">
                    ${col.label}
                    <span class="contagem">${itens.length}</span>
                  </div>
                  <div class="coluna-body" data-coluna="${col.id}">
                    ${bodyHtml}
                  </div>
                </div>
              `;
                }).join('');

                document.querySelectorAll('.kanban-card').forEach(el => {
                    el.setAttribute('draggable', 'true');
                    el.addEventListener('dragstart', onDragStart);
                    el.addEventListener('dragend', onDragEnd);
                });

                document.querySelectorAll('.kanban-coluna .coluna-body').forEach(el => {
                    el.addEventListener('dragover', onDragOver);
                    el.addEventListener('dragenter', onDragEnter);
                    el.addEventListener('dragleave', onDragLeave);
                    el.addEventListener('drop', onDrop);
                });

                document.querySelectorAll('.kanban-card').forEach(el => {
                    el.addEventListener('click', (e) => {
                        const id = el.dataset.id;
                        if (id) abrirDetalhe(id);
                    });
                });
            }

            function kanbanCardHTML(arte) {
                const img = arte.imagens && arte.imagens.length > 0 ? arte.imagens[0] : '';
                const thumbHtml = img ?
                    `<img src="${img}" alt="${arte.nome}" loading="lazy" />` :
                    `<i class="fas fa-image"></i>`;
                return `
              <div class="kanban-card" data-id="${arte.id}" draggable="true">
                <div class="card-top">
                  <div class="thumb">${thumbHtml}</div>
                  <div class="card-nome">${arte.nome}</div>
                </div>
                <div class="card-footer">
                  <div class="progresso-bar">
                    <div class="preenchido" style="width:${arte.progresso}%;"></div>
                  </div>
                  <span class="progresso-texto">${arte.progresso}%</span>
                </div>
              </div>
            `;
            }

            // ============================================================
            // DRAG & DROP
            // ============================================================
            let dragItemId = null;

            function onDragStart(e) {
                const card = e.target.closest('.kanban-card');
                if (!card) return;
                dragItemId = card.dataset.id;
                card.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', dragItemId);
            }

            function onDragEnd(e) {
                const card = e.target.closest('.kanban-card');
                if (card) card.classList.remove('dragging');
                document.querySelectorAll('.kanban-coluna').forEach(el => el.classList.remove('drag-over'));
            }

            function onDragOver(e) {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
            }

            function onDragEnter(e) {
                e.preventDefault();
                const coluna = e.target.closest('.kanban-coluna');
                if (coluna) coluna.classList.add('drag-over');
            }

            function onDragLeave(e) {
                const coluna = e.target.closest('.kanban-coluna');
                if (coluna && !coluna.contains(e.relatedTarget)) {
                    coluna.classList.remove('drag-over');
                }
            }

            function onDrop(e) {
                e.preventDefault();
                const coluna = e.target.closest('.kanban-coluna');
                if (!coluna) return;
                coluna.classList.remove('drag-over');

                const novoStatus = coluna.dataset.status;
                if (!novoStatus) return;

                const id = e.dataTransfer.getData('text/plain');
                if (!id) return;

                const arte = obterArte(id);
                if (!arte) return;
                if (arte.status === novoStatus) return;

                arte.status = novoStatus;
                if (novoStatus === 'Finalizada' && arte.progresso < 100) {
                    arte.progresso = 100;
                }
                salvarDados();
                renderizarTudo();
                salvarToast(`"${arte.nome}" movido para ${novoStatus}`, 'fa-arrows-left-right');
            }

            // ============================================================
            // DETALHE (modal)
            // ============================================================
            function abrirDetalhe(id) {
                const arte = obterArte(id);
                if (!arte) {
                    salvarToast('Arte não encontrada.', 'fa-exclamation-triangle');
                    return;
                }

                const container = document.getElementById('detalheConteudo');
                const statusCls = gerarCorStatus(arte.status);

                const imgPrincipal = arte.imagens && arte.imagens.length > 0 ? arte.imagens[0] : '';
                const imgHtml = imgPrincipal ?
                    `<img src="${imgPrincipal}" alt="${arte.nome}" loading="lazy" />` :
                    `<i class="fas fa-image"></i>`;

                let galeriaHtml = '';
                if (arte.imagens && arte.imagens.length > 1) {
                    galeriaHtml = `
                <div style="margin:12px 0 6px;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Galeria</div>
                <div class="detalhe-galeria">
                  ${arte.imagens.map(img => `
                    <div class="img-thumb"><img src="${img}" loading="lazy" /></div>
                  `).join('')}
                </div>
              `;
                }

                const etapasHtml = arte.etapas && arte.etapas.length ?
                    arte.etapas.map(e => `<span class="etapa concluida">✓ ${e}</span>`).join('') :
                    '<span class="etapa">Nenhuma etapa registrada</span>';

                const linksHtml = [];
                const linkMap = {
                    '🔗 Arte': arte.links.arte,
                    '📁 Drive': arte.links.drive,
                    '🎨 Figma': arte.links.figma,
                    '📌 Pinterest': arte.links.pinterest,
                    '📎 Referência': arte.links.referencia
                };
                for (const [label, url] of Object.entries(linkMap)) {
                    if (url) {
                        linksHtml.push(`<a href="${url}" target="_blank" rel="noopener">${label}</a>`);
                    }
                }

                const refsHtml = arte.referencias && arte.referencias.length ?
                    arte.referencias.map(r => `<span class="ref-tag">${r}</span>`).join('') :
                    '';

                container.innerHTML = `
              <div class="detalhe-topo">
                <div class="img-principal">${imgHtml}</div>
                <div class="info-principal">
                  <div class="nome">${arte.nome}</div>
                  <div class="categoria">${arte.categoria}</div>
                  <div class="descricao">${arte.descricao || 'Sem descrição.'}</div>
                  <span class="status-badge ${statusCls}">${arte.status}</span>
                </div>
              </div>

              ${galeriaHtml}

              <div class="detalhe-info-extra">
                <div class="item"><strong>Progresso</strong> ${arte.progresso}%</div>
                <div class="item"><strong>Data</strong> ${formatarData(arte.dataCriacao)}</div>
                <div class="item"><strong>Artista</strong> ${arte.artista || '—'}</div>
                <div class="item"><strong>Software</strong> ${arte.software || '—'}</div>
              </div>

              ${arte.objetivo ? `<p style="font-size:0.85rem;color:var(--text-secondary);margin:4px 0;"><strong>Objetivo:</strong> ${arte.objetivo}</p>` : ''}
              ${arte.importancia ? `<p style="font-size:0.85rem;color:var(--text-secondary);margin:4px 0 12px;"><strong>Importância:</strong> ${arte.importancia}</p>` : ''}

              <div style="margin:12px 0 6px;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Etapas</div>
              <div class="detalhe-etapas">${etapasHtml}</div>

              ${linksHtml.length ? `<div style="margin:12px 0 6px;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Links</div><div class="detalhe-links">${linksHtml.join('')}</div>` : ''}

              ${refsHtml ? `<div style="margin:14px 0 6px;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Referências</div><div class="detalhe-referencias">${refsHtml}</div>` : ''}

              ${arte.tags && arte.tags.length ? `<div style="margin:14px 0 6px;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Tags</div><div class="detalhe-referencias">${arte.tags.map(t => `<span class="ref-tag">#${t}</span>`).join('')}</div>` : ''}

              ${arte.observacoes ? `<div style="margin:14px 0 6px;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);">Observações</div><p style="font-size:0.85rem;color:var(--text-secondary);">${arte.observacoes}</p>` : ''}

              <div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap;border-top:1px solid var(--border-glass);padding-top:18px;">
                <button class="btn btn-sm" id="btnEditarDetalhe" style="background:var(--gold-dim);border-color:var(--gold);color:var(--gold);"><i class="fas fa-pen"></i> Editar</button>
                <button class="btn btn-sm" id="btnExcluirDetalhe" style="background:rgba(200,60,60,0.10);border-color:rgba(200,60,60,0.16);color:#d66a6a;"><i class="fas fa-trash"></i> Excluir</button>
              </div>
            `;

                container.querySelector('#btnEditarDetalhe')?.addEventListener('click', () => {
                    fecharModalDetalhe();
                    abrirEditor(arte.id);
                });

                container.querySelector('#btnExcluirDetalhe')?.addEventListener('click', () => {
                    if (confirm(`Deseja realmente excluir "${arte.nome}"?`)) {
                        removerArte(arte.id);
                        fecharModalDetalhe();
                        renderizarTudo();
                        salvarToast(`"${arte.nome}" removido.`, 'fa-trash');
                    }
                });

                modalDetalhe.classList.add('aberto');
            }

            function fecharModalDetalhe() {
                modalDetalhe.classList.remove('aberto');
            }

            // ============================================================
            // EDITOR
            // ============================================================
            function abrirEditor(id = null) {
                arteEditandoId = id;
                const isEdit = !!id;

                modalArteTitulo.innerHTML = isEdit ?
                    '<i class="fas fa-pen-fancy"></i> Editar Arte' :
                    '<i class="fas fa-plus-circle"></i> Nova Arte';

                imagensTemp = [];

                if (isEdit) {
                    const arte = obterArte(id);
                    if (!arte) {
                        salvarToast('Arte não encontrada.', 'fa-exclamation-triangle');
                        return;
                    }
                    arteId.value = arte.id;
                    fNome.value = arte.nome || '';
                    fCategoria.value = arte.categoria || 'Outro';
                    fDescricao.value = arte.descricao || '';
                    fObjetivo.value = arte.objetivo || '';
                    fImportancia.value = arte.importancia || '';
                    fStatus.value = arte.status || 'Ideia';
                    fProgresso.value = arte.progresso || 0;
                    progressoLabel.textContent = (arte.progresso || 0) + '%';
                    fLinkArte.value = arte.links?.arte || '';
                    fLinkDrive.value = arte.links?.drive || '';
                    fLinkFigma.value = arte.links?.figma || '';
                    fLinkPinterest.value = arte.links?.pinterest || '';
                    fLinkReferencia.value = arte.links?.referencia || '';
                    fTags.value = (arte.tags || []).join(', ');
                    fSoftware.value = arte.software || '';
                    fArtista.value = arte.artista || '';
                    fObservacoes.value = arte.observacoes || '';
                    setEtapasCheckboxes(arte.etapas || []);
                    if (arte.imagens && arte.imagens.length) {
                        imagensTemp = [...arte.imagens];
                        renderizarPreviews();
                    } else {
                        imagensTemp = [];
                        renderizarPreviews();
                    }
                } else {
                    arteId.value = '';
                    fNome.value = '';
                    fCategoria.value = 'Concept Art';
                    fDescricao.value = '';
                    fObjetivo.value = '';
                    fImportancia.value = '';
                    fStatus.value = 'Ideia';
                    fProgresso.value = 0;
                    progressoLabel.textContent = '0%';
                    fLinkArte.value = '';
                    fLinkDrive.value = '';
                    fLinkFigma.value = '';
                    fLinkPinterest.value = '';
                    fLinkReferencia.value = '';
                    fTags.value = '';
                    fSoftware.value = '';
                    fArtista.value = '';
                    fObservacoes.value = '';
                    setEtapasCheckboxes([]);
                    imagensTemp = [];
                    renderizarPreviews();
                }

                modalArte.classList.add('aberto');
            }

            function fecharEditor() {
                modalArte.classList.remove('aberto');
                arteEditandoId = null;
                imagensTemp = [];
                renderizarPreviews();
            }

            // ============================================================
            // UPLOAD
            // ============================================================
            function renderizarPreviews() {
                previewImagens.innerHTML = imagensTemp.map((img, index) => `
              <div class="mini">
                <img src="${img}" />
                <button class="remover" data-index="${index}"><i class="fas fa-times"></i></button>
              </div>
            `).join('');

                previewImagens.querySelectorAll('.remover').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const idx = parseInt(btn.dataset.index, 10);
                        imagensTemp.splice(idx, 1);
                        renderizarPreviews();
                    });
                });
            }

            uploadArea.addEventListener('click', () => fImagens.click());

            fImagens.addEventListener('change', (e) => {
                const files = e.target.files;
                if (!files.length) return;
                for (let file of files) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        imagensTemp.push(ev.target.result);
                        renderizarPreviews();
                    };
                    reader.readAsDataURL(file);
                }
                fImagens.value = '';
            });

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--gold)';
            });
            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = 'var(--border-glass)';
            });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--border-glass)';
                const files = e.dataTransfer.files;
                if (!files.length) return;
                for (let file of files) {
                    if (file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            imagensTemp.push(ev.target.result);
                            renderizarPreviews();
                        };
                        reader.readAsDataURL(file);
                    }
                }
            });

            // ============================================================
            // SUBMIT
            // ============================================================
            formArte.addEventListener('submit', (e) => {
                e.preventDefault();

                const dados = {
                    nome: fNome.value.trim(),
                    categoria: fCategoria.value,
                    descricao: fDescricao.value.trim(),
                    objetivo: fObjetivo.value.trim(),
                    importancia: fImportancia.value.trim(),
                    status: fStatus.value,
                    progresso: Number(fProgresso.value),
                    etapas: getEtapasFromCheckboxes(),
                    linkArte: fLinkArte.value.trim(),
                    linkDrive: fLinkDrive.value.trim(),
                    linkFigma: fLinkFigma.value.trim(),
                    linkPinterest: fLinkPinterest.value.trim(),
                    linkReferencia: fLinkReferencia.value.trim(),
                    imagens: imagensTemp.length ? imagensTemp : [],
                    software: fSoftware.value.trim(),
                    artista: fArtista.value.trim(),
                    observacoes: fObservacoes.value.trim(),
                    tags: extrairTags(fTags.value),
                    referencias: [],
                    historico: []
                };

                if (!dados.nome) {
                    salvarToast('O nome da arte é obrigatório.', 'fa-exclamation-triangle');
                    return;
                }

                const id = arteId.value;
                let resultado;
                if (id) {
                    resultado = atualizarArte(id, dados);
                    if (resultado) salvarToast(`"${resultado.nome}" atualizado!`, 'fa-check');
                } else {
                    resultado = criarArte(dados);
                    salvarToast(`"${resultado.nome}" criado!`, 'fa-check');
                }

                fecharEditor();
                renderizarTudo();
            });

            // ============================================================
            // EVENTOS DE MODAL
            // ============================================================
            $('#fecharModalArte').addEventListener('click', fecharEditor);
            $('#cancelarModalArte').addEventListener('click', fecharEditor);
            modalArte.addEventListener('click', (e) => {
                if (e.target === modalArte) fecharEditor();
            });

            $('#fecharModalDetalhe').addEventListener('click', fecharModalDetalhe);
            modalDetalhe.addEventListener('click', (e) => {
                if (e.target === modalDetalhe) fecharModalDetalhe();
            });

            // ============================================================
            // BOTÃO NOVA ARTE
            // ============================================================
            $('#btnNovaArte').addEventListener('click', () => abrirEditor(null));

            // ============================================================
            // TABS
            // ============================================================
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('ativo'));
                    btn.classList.add('ativo');
                    const tab = btn.dataset.tab;
                    document.querySelectorAll('.painel').forEach(p => p.classList.remove('ativo'));
                    document.getElementById('painel-' + tab).classList.add('ativo');
                    if (tab === 'pipeline') {
                        renderizarStats();
                        renderizarKanban();
                    }
                    if (tab === 'exposicao') {
                        setTimeout(() => renderizarExposicao(), 50);
                    }
                });
            });

            // ============================================================
            // PROGRESSO SLIDER
            // ============================================================
            fProgresso.addEventListener('input', (e) => {
                progressoLabel.textContent = e.target.value + '%';
            });

            // ============================================================
            // EXPORTAR / IMPORTAR
            // ============================================================
            $('#btnExportar').addEventListener('click', exportarDados);

            $('#btnImportar').addEventListener('click', () => {
                document.getElementById('inputImportar').click();
            });

            document.getElementById('inputImportar').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    importarDados(file);
                }
                e.target.value = '';
            });

            // ============================================================
            // RENDERIZAR TUDO
            // ============================================================
            function renderizarTudo() {
                renderizarExposicao();
                renderizarStats();
                const kanbanPainel = document.getElementById('painel-pipeline');
                if (kanbanPainel.classList.contains('ativo')) {
                    renderizarKanban();
                }
            }

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            carregarDados();
            renderizarTudo();

            setTimeout(() => {
                if (document.getElementById('painel-pipeline').classList.contains('ativo')) {
                    renderizarKanban();
                }
            }, 100);

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    if (modalDetalhe.classList.contains('aberto')) fecharModalDetalhe();
                    if (modalArte.classList.contains('aberto')) fecharEditor();
                }
            });

            window.artesModule = {
                getArtes: () => artes,
                adicionarArte: criarArte,
                atualizarArte: atualizarArte,
                removerArte: removerArte,
                obterArte: obterArte,
                salvarDados: salvarDados,
                carregarDados: carregarDados
            };

            console.log('🎨 Módulo Artes (Exposição Cinematográfica com Slideshow + Pipeline) inicializado.');
            console.log(`📦 ${artes.length} artes carregadas.`);

        })();
    </script>

</body>
</html>
