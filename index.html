<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Dev Hub · Escuro Neutro</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* ============================================================
           RESET & BASE — escuro neutro
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0e1217;
            --bg-secondary: #161c24;
            --bg-tertiary: #1f2833;
            --bg-elevated: #2a3440;
            --bg-sidebar: #0a0e12;
            --bg-card: #1a212a;
            --bg-glass: rgba(255, 255, 255, 0.03);

            --text-primary: #e4eaf0;
            --text-secondary: #9aabbf;
            --text-muted: #5a6e82;
            --text-inverse: #0e1217;

            --border-subtle: #2a3642;
            --border-medium: #3a4a5a;
            --border-glow: rgba(90, 160, 220, 0.25);

            --accent-cyan: #5a9fd4;
            --accent-cyan-dim: rgba(90, 159, 212, 0.10);
            --accent-cyan-glow: rgba(90, 159, 212, 0.20);
            --accent-gold: #c8b06a;
            --accent-gold-dim: rgba(200, 176, 106, 0.08);
            --accent-red: #c06060;
            --accent-green: #6a9a7a;
            --accent-orange: #c08040;

            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.5);
            --shadow-md: 0 8px 32px rgba(0, 0, 0, 0.6);
            --shadow-lg: 0 16px 64px rgba(0, 0, 0, 0.7);

            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;

            --font: 'Inter', -apple-system, sans-serif;
            --sidebar-width: 260px;
            --header-height: 56px;
            --transition-speed: 0.2s;
        }

        html, body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 8px; }

        /* ============================================================
           LAYOUT
           ============================================================ */
        #app {
            display: flex;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: var(--bg-primary);
        }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: var(--sidebar-width);
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            transition: transform var(--transition-speed) ease;
            box-shadow: 4px 0 24px rgba(0,0,0,0.5);
        }
        #sidebar.collapsed { transform: translateX(-100%); }
        #sidebar.open { transform: translateX(0); }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px 14px;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
        }
        .sidebar-logo .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            background: var(--accent-cyan);
            color: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            flex-shrink: 0;
            box-shadow: 0 0 20px var(--accent-cyan-glow);
        }
        .sidebar-logo .logo-text {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }
        .sidebar-logo .logo-badge {
            font-size: 9px;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            background: var(--bg-tertiary);
            padding: 2px 12px;
            border-radius: 20px;
            margin-left: auto;
            border: 1px solid var(--border-subtle);
        }

        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px 24px;
        }
        .sidebar-group { margin-bottom: 16px; }
        .sidebar-group-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            padding: 6px 12px 8px;
            border-bottom: 1px solid var(--border-subtle);
            margin-bottom: 4px;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 450;
            transition: all var(--transition-speed) ease;
            border-left: 2px solid transparent;
            margin-bottom: 1px;
        }
        .sidebar-item:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-left-color: var(--accent-cyan);
        }
        .sidebar-item .icon {
            width: 18px;
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            transition: color var(--transition-speed) ease;
        }
        .sidebar-item:hover .icon { color: var(--accent-cyan); }
        .sidebar-item .label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-item.active {
            background: var(--accent-cyan-dim);
            color: var(--text-primary);
            border-left-color: var(--accent-cyan);
        }
        .sidebar-item.active .icon { color: var(--accent-cyan); }

        /* ============================================================
           HEADER
           ============================================================ */
        #header {
            height: var(--header-height);
            min-height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 14px;
            flex-shrink: 0;
            z-index: 100;
        }
        #hamburger {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            font-size: 16px;
            cursor: pointer;
            padding: 5px 10px;
            border-radius: var(--radius-sm);
            transition: all var(--transition-speed) ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #hamburger:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }
        .header-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-breadcrumb {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .header-breadcrumb .sep { color: var(--border-medium); font-weight: 700; }
        .header-breadcrumb .crumb { color: var(--text-secondary); }
        .header-breadcrumb .crumb:last-child { color: var(--text-primary); font-weight: 600; }
        .header-breadcrumb .crumb-link {
            color: var(--text-muted);
            cursor: pointer;
            transition: color var(--transition-speed) ease;
            border-bottom: 1px dotted transparent;
        }
        .header-breadcrumb .crumb-link:hover { color: var(--accent-cyan); border-bottom-color: var(--accent-cyan); }

        .header-search {
            display: flex;
            align-items: center;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 30px;
            padding: 0 14px;
            gap: 8px;
            flex-shrink: 0;
            min-width: 160px;
            max-width: 220px;
            transition: border-color var(--transition-speed) ease, box-shadow 0.2s ease;
        }
        .header-search:focus-within {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px var(--accent-cyan-glow);
        }
        .header-search .search-icon { color: var(--text-muted); font-size: 13px; }
        .header-search input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 13px;
            padding: 7px 0;
            width: 100%;
        }
        .header-search input::placeholder { color: var(--text-muted); font-style: italic; }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }
        .header-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            color: var(--text-muted);
            font-size: 14px;
            padding: 5px 9px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .header-btn:hover {
            background: var(--bg-elevated);
            color: var(--text-primary);
            border-color: var(--border-medium);
        }
        .header-btn:active { transform: scale(0.95); }
        .header-btn .tooltip {
            display: none;
            position: absolute;
            bottom: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-elevated);
            color: var(--text-primary);
            padding: 4px 12px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-sm);
            pointer-events: none;
        }
        .header-btn:hover .tooltip { display: block; }

        .save-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-muted);
            padding: 4px 12px 4px 8px;
            border: 1px solid var(--border-subtle);
            border-radius: 30px;
            background: var(--bg-glass);
        }
        .save-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
            transition: background 0.3s;
            box-shadow: 0 0 10px var(--accent-green);
        }
        .save-indicator .dot.saving {
            background: var(--accent-orange);
            box-shadow: 0 0 16px var(--accent-orange);
            animation: pulse-dot 0.7s ease-in-out infinite alternate;
        }
        .save-indicator .dot.error {
            background: var(--accent-red);
            box-shadow: 0 0 16px var(--accent-red);
        }
        @keyframes pulse-dot {
            0% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ============================================================
           MAIN — com iframe
           ============================================================ */
        #main {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: margin-left var(--transition-speed) ease;
            background: var(--bg-primary);
        }
        #main.expanded { margin-left: 0; }

        #content {
            flex: 1;
            overflow: hidden;
            position: relative;
            background: var(--bg-primary);
        }
        #content iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg-primary);
            display: block;
        }

        /* ============================================================
           TOASTS
           ============================================================ */
        #toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 9999;
            max-width: 380px;
            width: 100%;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            box-shadow: var(--shadow-md);
            animation: toastSlide 0.3s ease forwards;
            transition: opacity 0.3s, transform 0.3s;
            border-left: 4px solid var(--text-muted);
        }
        .toast.removing { opacity: 0; transform: translateX(30px); }
        .toast .toast-icon { font-size: 16px; flex-shrink: 0; margin-top: 2px; }
        .toast .toast-content { flex: 1; min-width: 0; }
        .toast .toast-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .toast .toast-message { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px; line-height: 1.5; }
        .toast .toast-close {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding-left: 10px;
            transition: color 0.2s, transform 0.2s;
        }
        .toast .toast-close:hover { color: var(--text-primary); transform: scale(1.1); }
        .toast.success { border-left-color: var(--accent-green); }
        .toast.success .toast-icon { color: var(--accent-green); }
        .toast.error { border-left-color: var(--accent-red); }
        .toast.error .toast-icon { color: var(--accent-red); }
        .toast.warning { border-left-color: var(--accent-orange); }
        .toast.warning .toast-icon { color: var(--accent-orange); }
        .toast.info { border-left-color: var(--accent-cyan); }
        .toast.info .toast-icon { color: var(--accent-cyan); }
        @keyframes toastSlide {
            0% { opacity: 0; transform: translateX(30px) scale(0.95); }
            100% { opacity: 1; transform: translateX(0) scale(1); }
        }

        /* ============================================================
           CONFIRMAÇÃO
           ============================================================ */
        #confirmation-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 10000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        #confirmation-overlay.open { display: flex; }
        .confirmation-box {
            background: var(--bg-elevated);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 28px 32px;
            max-width: 440px;
            width: 90%;
            box-shadow: var(--shadow-lg);
            animation: modalPop 0.25s ease forwards;
        }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .confirmation-box .conf-icon { font-size: 28px; margin-bottom: 10px; display: block; }
        .confirmation-box h3 { font-size: 18px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
        .confirmation-box p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 22px; }
        .confirmation-box .conf-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .conf-btn {
            padding: 8px 22px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-speed) ease;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
        }
        .conf-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .conf-btn:active { transform: scale(0.95); }
        .conf-btn.primary {
            background: var(--accent-cyan);
            color: var(--bg-primary);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px var(--accent-cyan-glow);
        }
        .conf-btn.primary:hover { filter: brightness(1.05); box-shadow: 0 0 30px var(--accent-cyan-glow); }
        .conf-btn.danger {
            background: var(--accent-red);
            color: #fff;
            border-color: var(--accent-red);
            box-shadow: 0 0 20px rgba(192, 96, 96, 0.3);
        }
        .conf-btn.danger:hover { filter: brightness(1.05); }

        /* ============================================================
           RESPONSIVIDADE
           ============================================================ */
        @media (max-width: 768px) {
            :root { --sidebar-width: 280px; --header-height: 50px; }
            #sidebar { transform: translateX(-100%); border-right: none; }
            #sidebar.open { transform: translateX(0); }
            #sidebar.collapsed { transform: translateX(-100%); }
            #main { margin-left: 0; }
            #main.expanded { margin-left: 0; }
            .header-left .header-breadcrumb { display: none; }
            .header-title { font-size: 15px; }
            .header-search { min-width: 90px; max-width: 130px; padding: 0 10px; }
            .header-actions .header-btn .tooltip { display: none !important; }
            .header-actions .header-btn { padding: 4px 6px; font-size: 13px; }
            .save-indicator span { display: none; }
            .save-indicator { padding: 3px 8px; }
            #toast-container { bottom: 12px; right: 12px; left: 12px; max-width: 100%; }
            .toast { padding: 10px 14px; }
            .confirmation-box { padding: 20px; }
        }
        @media (max-width: 480px) {
            .header-search { min-width: 60px; max-width: 90px; padding: 0 6px; }
            .header-search input { font-size: 11px; }
            .sidebar-logo .logo-text { font-size: 15px; }
        }

        #sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
            backdrop-filter: blur(4px);
        }
        #sidebar-overlay.open { display: block; }
        @media (min-width: 769px) { #sidebar-overlay { display: none !important; } }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="app">

        <div id="sidebar-overlay"></div>

        <!-- SIDEBAR -->
        <nav id="sidebar" role="navigation">
            <div class="sidebar-logo">
                <div class="logo-icon" aria-hidden="true">✦</div>
                <span class="logo-text">Game Hub</span>
                <span class="logo-badge">v2</span>
            </div>
            <div class="sidebar-nav" id="sidebarNav"></div>
        </nav>

        <!-- MAIN -->
        <div id="main">
            <header id="header">
                <button id="hamburger" aria-label="Alternar barra lateral">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="header-left">
                    <span class="header-title" id="pageTitle">Overview</span>
                    <div class="header-breadcrumb" id="breadcrumb">
                        <span class="crumb">Hub</span>
                        <span class="sep">/</span>
                        <span class="crumb crumb-link" data-page="overview">Overview</span>
                    </div>
                </div>
                <div class="header-search" role="search">
                    <i class="fas fa-search search-icon" aria-hidden="true"></i>
                    <input type="text" id="globalSearch" placeholder="Pesquisar..." aria-label="Pesquisa global">
                </div>
                <div class="header-actions">
                    <button class="header-btn" id="btnExport" title="Exportar projeto">
                        <i class="fas fa-file-export"></i>
                        <span class="tooltip">Exportar</span>
                    </button>
                    <button class="header-btn" id="btnImport" title="Importar projeto">
                        <i class="fas fa-file-import"></i>
                        <span class="tooltip">Importar</span>
                    </button>
                    <button class="header-btn" id="btnBackup" title="Criar backup">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span class="tooltip">Backup</span>
                    </button>
                    <button class="header-btn" id="btnRestore" title="Restaurar backup">
                        <i class="fas fa-cloud-download-alt"></i>
                        <span class="tooltip">Restaurar</span>
                    </button>
                    <button class="header-btn" id="btnSettings" title="Configurações">
                        <i class="fas fa-sliders-h"></i>
                        <span class="tooltip">Config.</span>
                    </button>
                    <button class="header-btn" id="btnReset" title="Resetar projeto">
                        <i class="fas fa-trash-alt"></i>
                        <span class="tooltip">Resetar</span>
                    </button>
                    <div class="save-indicator" id="saveIndicator" title="Status do salvamento">
                        <span class="dot" id="saveDot"></span>
                        <span id="saveText">Salvo</span>
                    </div>
                </div>
            </header>

            <main id="content" role="main">
                <!-- O conteúdo será carregado via iframe -->
                <iframe id="pageFrame" src="about:blank" sandbox="allow-scripts allow-same-origin"></iframe>
            </main>
        </div>
    </div>

    <div id="toast-container" aria-live="polite"></div>

    <div id="confirmation-overlay" role="dialog" aria-modal="true">
        <div class="confirmation-box">
            <span class="conf-icon" id="confIcon">⚠️</span>
            <h3 id="confTitle">Confirmar</h3>
            <p id="confMessage">Tem certeza que deseja continuar?</p>
            <div class="conf-actions">
                <button class="conf-btn" id="confCancel">Cancelar</button>
                <button class="conf-btn primary" id="confConfirm">Confirmar</button>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".json" style="display:none">

    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONFIG
            // ============================================================
            const CONFIG = {
                version: '2.0.0',
                storageKey: 'gamehub_project',
                backupKey: 'gamehub_backups',
                settingsKey: 'gamehub_settings',
                maxBackups: 10,
                autoSaveDelay: 800,
                pagesBase: 'pages/',
                defaultPage: 'overview',
                sidebarItems: [{
                    group: 'Geral',
                    items: [
                        { id: 'overview', label: 'Overview', icon: 'fa-gauge-high' },
                        { id: 'historia', label: 'História', icon: 'fa-book' },
                        { id: 'personagens', label: 'Personagens', icon: 'fa-users' },
                        { id: 'cidade', label: 'Cidade', icon: 'fa-city' },
                        { id: 'lugares', label: 'Lugares', icon: 'fa-location-dot' },
                        { id: 'timeline', label: 'Linha do Tempo', icon: 'fa-timeline' },
                        { id: 'anomalia', label: 'Anomalia', icon: 'fa-triangle-exclamation' }
                    ]
                }, {
                    group: 'Desenvolvimento',
                    items: [
                        { id: 'capitulos', label: 'Capítulos', icon: 'fa-book-open' },
                        { id: 'mecanicas', label: 'Mecânicas', icon: 'fa-gear' },
                        { id: 'minijogos', label: 'Minijogos', icon: 'fa-gamepad' },
                        { id: 'objetos', label: 'Objetos', icon: 'fa-cube' },
                        { id: 'artes', label: 'Artes', icon: 'fa-palette' },
                        { id: 'interface', label: 'Interface', icon: 'fa-display' },
                        { id: 'programacao', label: 'Programação', icon: 'fa-code' }
                    ]
                }, {
                    group: 'Gestão',
                    items: [
                        { id: 'tarefas', label: 'Tarefas', icon: 'fa-list-check' },
                        { id: 'inspiracoes', label: 'Inspirações', icon: 'fa-lightbulb' },
                        { id: 'mural', label: 'Mural', icon: 'fa-notes-sticky' },
                        { id: 'referencias', label: 'Referências', icon: 'fa-bookmark' }
                    ]
                }]
            };

            // ============================================================
            // ESTADO
            // ============================================================
            const state = {
                currentPage: CONFIG.defaultPage,
                settings: { theme: 'dark' },
                isSaving: false,
                saveTimeout: null,
                sidebarOpen: true,
                isMobile: window.innerWidth <= 768,
            };

            // ============================================================
            // DOM REFS
            // ============================================================
            const $ = (sel, ctx) => (ctx || document).querySelector(sel);
            const $$ = (sel, ctx) => [...(ctx || document).querySelectorAll(sel)];

            const dom = {
                sidebar: $('#sidebar'),
                sidebarNav: $('#sidebarNav'),
                sidebarOverlay: $('#sidebar-overlay'),
                hamburger: $('#hamburger'),
                main: $('#main'),
                content: $('#content'),
                pageFrame: $('#pageFrame'),
                pageTitle: $('#pageTitle'),
                breadcrumb: $('#breadcrumb'),
                globalSearch: $('#globalSearch'),
                saveDot: $('#saveDot'),
                saveText: $('#saveText'),
                toastContainer: $('#toast-container'),
                confOverlay: $('#confirmation-overlay'),
                confIcon: $('#confIcon'),
                confTitle: $('#confTitle'),
                confMessage: $('#confMessage'),
                confConfirm: $('#confConfirm'),
                confCancel: $('#confCancel'),
                fileInput: $('#fileInput'),
                btnExport: $('#btnExport'),
                btnImport: $('#btnImport'),
                btnBackup: $('#btnBackup'),
                btnRestore: $('#btnRestore'),
                btnSettings: $('#btnSettings'),
                btnReset: $('#btnReset'),
            };

            // ============================================================
            // STORAGE
            // ============================================================
            const Storage = {
                getProject() {
                    try {
                        const raw = localStorage.getItem(CONFIG.storageKey);
                        if (raw) { const data = JSON.parse(raw); if (data && typeof data === 'object') return data; }
                    } catch (_) {}
                    return null;
                },
                saveProject(data) {
                    try {
                        const payload = { version: CONFIG.version, lastSaved: new Date().toISOString(), data: data || {} };
                        localStorage.setItem(CONFIG.storageKey, JSON.stringify(payload));
                        return true;
                    } catch (_) { return false; }
                },
                loadProject() {
                    const raw = this.getProject();
                    return raw ? raw.data || {} : {};
                },
                getSettings() {
                    try {
                        const raw = localStorage.getItem(CONFIG.settingsKey);
                        if (raw) { const parsed = JSON.parse(raw); if (parsed && typeof parsed === 'object') return parsed; }
                    } catch (_) {}
                    return null;
                },
                saveSettings(settings) {
                    try { localStorage.setItem(CONFIG.settingsKey, JSON.stringify(settings)); return true; } catch (_) {
                        return false; }
                },
                getBackups() {
                    try {
                        const raw = localStorage.getItem(CONFIG.backupKey);
                        if (raw) { const parsed = JSON.parse(raw); if (Array.isArray(parsed)) return parsed; }
                    } catch (_) {}
                    return [];
                },
                saveBackups(backups) {
                    try {
                        const limited = backups.slice(0, CONFIG.maxBackups);
                        localStorage.setItem(CONFIG.backupKey, JSON.stringify(limited));
                        return true;
                    } catch (_) { return false; }
                },
                createBackup() {
                    const project = this.getProject();
                    if (!project) return false;
                    const backups = this.getBackups();
                    const entry = { id: Date.now(), timestamp: new Date().toISOString(), data: project };
                    backups.unshift(entry);
                    this.saveBackups(backups);
                    return entry;
                },
                restoreBackup(id) {
                    const backups = this.getBackups();
                    const entry = backups.find(b => b.id === id);
                    if (!entry) return false;
                    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(entry.data)); return true; } catch (_) {
                        return false; }
                },
                getLatestBackup() {
                    const backups = this.getBackups();
                    return backups.length > 0 ? backups[0] : null;
                },
                resetProject() {
                    try { localStorage.removeItem(CONFIG.storageKey); return true; } catch (_) { return false; }
                },
                exportJSON() {
                    const project = this.getProject();
                    if (!project) return null;
                    return JSON.stringify(project, null, 2);
                },
                importJSON(json) {
                    try {
                        const data = JSON.parse(json);
                        if (!data || typeof data !== 'object') return false;
                        localStorage.setItem(CONFIG.storageKey, JSON.stringify(data));
                        return true;
                    } catch (_) { return false; }
                }
            };

            // ============================================================
            // NOTIFICAÇÕES
            // ============================================================
            const Notifications = {
                _container: dom.toastContainer,
                show(message, type = 'info', duration = 4000) {
                    const types = {
                        success: { icon: 'fa-check-circle', label: 'Sucesso' },
                        error: { icon: 'fa-times-circle', label: 'Erro' },
                        warning: { icon: 'fa-exclamation-triangle', label: 'Aviso' },
                        info: { icon: 'fa-info-circle', label: 'Informação' }
                    };
                    const t = types[type] || types.info;
                    const toast = document.createElement('div');
                    toast.className = `toast ${type}`;
                    toast.innerHTML = `
                        <span class="toast-icon"><i class="fas ${t.icon}"></i></span>
                        <div class="toast-content">
                            <div class="toast-title">${t.label}</div>
                            <div class="toast-message">${message}</div>
                        </div>
                        <button class="toast-close" aria-label="Fechar"><i class="fas fa-times"></i></button>
                    `;
                    const close = () => {
                        toast.classList.add('removing');
                        setTimeout(() => { if (toast.parentNode) toast.remove(); }, 300);
                    };
                    toast.querySelector('.toast-close').addEventListener('click', close);
                    this._container.appendChild(toast);
                    if (duration > 0) setTimeout(close, duration);
                    return toast;
                },
                success(msg, dur) { return this.show(msg, 'success', dur); },
                error(msg, dur) { return this.show(msg, 'error', dur); },
                warning(msg, dur) { return this.show(msg, 'warning', dur); },
                info(msg, dur) { return this.show(msg, 'info', dur); }
            };

            // ============================================================
            // CONFIRMAÇÃO
            // ============================================================
            const Confirmation = {
                _resolve: null,
                _reject: null,
                show(message, title = 'Confirmar', icon = '⚠️', confirmLabel = 'Confirmar', cancelLabel = 'Cancelar',
                    isDanger = false) {
                    return new Promise((resolve, reject) => {
                        dom.confIcon.textContent = icon;
                        dom.confTitle.textContent = title;
                        dom.confMessage.textContent = message;
                        dom.confConfirm.textContent = confirmLabel;
                        dom.confCancel.textContent = cancelLabel;
                        dom.confConfirm.className = isDanger ? 'conf-btn danger' : 'conf-btn primary';
                        dom.confOverlay.classList.add('open');
                        this._resolve = resolve;
                        this._reject = reject;
                    });
                },
                _close(result) {
                    dom.confOverlay.classList.remove('open');
                    if (result === true && this._resolve) this._resolve(true);
                    else if (result === false && this._reject) this._reject(false);
                    else if (this._resolve) this._resolve(result);
                    this._resolve = null;
                    this._reject = null;
                },
                _initEvents() {
                    dom.confConfirm.addEventListener('click', () => this._close(true));
                    dom.confCancel.addEventListener('click', () => this._close(false));
                    dom.confOverlay.addEventListener('click', (e) => {
                        if (e.target === dom.confOverlay) this._close(false);
                    });
                    document.addEventListener('keydown', (e) => {
                        if (!dom.confOverlay.classList.contains('open')) return;
                        if (e.key === 'Escape') this._close(false);
                        if (e.key === 'Enter') this._close(true);
                    });
                }
            };

            // ============================================================
            // SIDEBAR
            // ============================================================
            const Sidebar = {
                _activeId: null,

                render() {
                    const nav = dom.sidebarNav;
                    let html = '';
                    for (const group of CONFIG.sidebarItems) {
                        html += `<div class="sidebar-group">`;
                        html += `<div class="sidebar-group-title">${group.group}</div>`;
                        for (const item of group.items) {
                            const active = item.id === this._activeId ? 'active' : '';
                            html += `
                                <div class="sidebar-item ${active}" data-page="${item.id}" role="button" tabindex="0" aria-label="${item.label}">
                                    <span class="icon"><i class="fas ${item.icon}"></i></span>
                                    <span class="label">${item.label}</span>
                                </div>
                            `;
                        }
                        html += `</div>`;
                    }
                    nav.innerHTML = html;
                    nav.querySelectorAll('.sidebar-item').forEach(el => {
                        el.addEventListener('click', () => {
                            const page = el.dataset.page;
                            if (page) this.navigate(page);
                        });
                        el.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter' || e.key === ' ') {
                                e.preventDefault();
                                const page = el.dataset.page;
                                if (page) this.navigate(page);
                            }
                        });
                    });
                },

                setActive(pageId) {
                    this._activeId = pageId;
                    const items = dom.sidebarNav.querySelectorAll('.sidebar-item');
                    items.forEach(el => el.classList.toggle('active', el.dataset.page === pageId));
                },

                navigate(pageId) {
                    if (pageId === this._activeId && dom.pageFrame.src.includes(pageId)) return;
                    PageLoader.load(pageId);
                    if (state.isMobile && state.sidebarOpen) this.close();
                },

                openDesktop() {
                    dom.sidebar.classList.remove('collapsed');
                    dom.main.classList.remove('expanded');
                    state.sidebarOpen = true;
                    this._updateButtonIcon();
                },
                closeDesktop() {
                    dom.sidebar.classList.add('collapsed');
                    dom.main.classList.add('expanded');
                    state.sidebarOpen = false;
                    this._updateButtonIcon();
                },
                openMobile() {
                    dom.sidebar.classList.add('open');
                    dom.sidebarOverlay.classList.add('open');
                    state.sidebarOpen = true;
                    this._updateButtonIcon();
                },
                closeMobile() {
                    dom.sidebar.classList.remove('open');
                    dom.sidebarOverlay.classList.remove('open');
                    state.sidebarOpen = false;
                    this._updateButtonIcon();
                },
                toggle() {
                    if (state.isMobile) {
                        state.sidebarOpen ? this.closeMobile() : this.openMobile();
                    } else {
                        state.sidebarOpen ? this.closeDesktop() : this.openDesktop();
                    }
                },
                initState() {
                    if (state.isMobile) {
                        dom.sidebar.classList.remove('open');
                        dom.sidebarOverlay.classList.remove('open');
                        state.sidebarOpen = false;
                        dom.sidebar.classList.remove('collapsed');
                        dom.main.classList.remove('expanded');
                    } else {
                        dom.sidebar.classList.remove('collapsed');
                        dom.main.classList.remove('expanded');
                        state.sidebarOpen = true;
                        dom.sidebar.classList.remove('open');
                        dom.sidebarOverlay.classList.remove('open');
                    }
                    this._updateButtonIcon();
                },
                _updateButtonIcon() {
                    const icon = dom.hamburger.querySelector('i');
                    if (!icon) return;
                    if (state.isMobile) {
                        icon.className = state.sidebarOpen ? 'fas fa-times' : 'fas fa-bars';
                        dom.hamburger.title = state.sidebarOpen ? 'Fechar menu' : 'Abrir menu';
                    } else {
                        icon.className = state.sidebarOpen ? 'fas fa-chevron-left' : 'fas fa-chevron-right';
                        dom.hamburger.title = state.sidebarOpen ? 'Recolher' : 'Expandir';
                    }
                },

                init() {
                    this.render();
                    this.initState();
                    const initialPage = window.location.hash.replace('#', '') || CONFIG.defaultPage;
                    this.setActive(initialPage);
                    PageLoader.load(initialPage);
                }
            };

            // ============================================================
            // PAGE LOADER (iframe)
            // ============================================================
            const PageLoader = {
                _currentPageId: null,

                load(pageId) {
                    if (pageId === this._currentPageId && dom.pageFrame.src.includes(pageId)) return;
                    this._currentPageId = pageId;

                    const label = this._getPageLabel(pageId);
                    dom.pageTitle.textContent = label || pageId;
                    dom.breadcrumb.innerHTML = `
                        <span class="crumb">Hub</span>
                        <span class="sep">/</span>
                        <span class="crumb">${label || pageId}</span>
                    `;
                    Sidebar.setActive(pageId);

                    if (window.location.hash !== '#' + pageId) {
                        history.pushState({ page: pageId }, '', '#' + pageId);
                    }

                    // Carregar no iframe
                    const url = CONFIG.pagesBase + pageId + '.html';
                    dom.pageFrame.src = url;

                    // Mostrar loading (opcional) — o iframe já tem seu próprio carregamento
                },

                _getPageLabel(id) {
                    for (const group of CONFIG.sidebarItems) {
                        for (const item of group.items) {
                            if (item.id === id) return item.label;
                        }
                    }
                    return id.charAt(0).toUpperCase() + id.slice(1);
                }
            };

            // ============================================================
            // HUB API
            // ============================================================
            const HubAPI = {
                getData(key) {
                    const project = Storage.getProject();
                    if (!project) return null;
                    if (key) return project.data && project.data[key] !== undefined ? project.data[key] : null;
                    return project.data || {};
                },
                saveData(key, data) {
                    const project = Storage.getProject();
                    if (!project) {
                        const newProject = { version: CONFIG.version, lastSaved: new Date().toISOString(), data: {} };
                        newProject.data[key] = data;
                        Storage.saveProject(newProject.data);
                    } else {
                        if (!project.data) project.data = {};
                        project.data[key] = data;
                        Storage.saveProject(project.data);
                    }
                    this._triggerAutoSave();
                    return true;
                },
                getAllData() {
                    const project = Storage.getProject();
                    return project ? project.data || {} : {};
                },
                setAllData(data) {
                    Storage.saveProject(data || {});
                    this._triggerAutoSave();
                    return true;
                },
                showNotification: (msg, type, dur) => Notifications.show(msg, type, dur),
                showConfirmation: (msg, title, icon, confirmLabel, cancelLabel, isDanger) =>
                    Confirmation.show(msg, title, icon, confirmLabel, cancelLabel, isDanger),
                exportProject() {
                    const json = Storage.exportJSON();
                    if (!json) { Notifications.error('Nenhum dado para exportar.'); return; }
                    const blob = new Blob([json], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `gamehub_project_${new Date().toISOString().slice(0,10)}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                    Notifications.success('Projeto exportado com sucesso!');
                },
                importProject(file) {
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try {
                                const json = e.target.result;
                                const success = Storage.importJSON(json);
                                if (success) {
                                    Notifications.success('Projeto importado com sucesso!');
                                    this._triggerAutoSave();
                                    resolve(true);
                                } else {
                                    Notifications.error('Erro ao importar: arquivo inválido.');
                                    reject(new Error('Arquivo inválido'));
                                }
                            } catch (err) {
                                Notifications.error('Erro ao importar: ' + err.message);
                                reject(err);
                            }
                        };
                        reader.onerror = () => { Notifications.error('Erro ao ler o arquivo.');
                            reject(new Error('Erro de leitura')); };
                        reader.readAsText(file);
                    });
                },
                createBackup() {
                    const entry = Storage.createBackup();
                    if (entry) { Notifications.success('Backup criado com sucesso!'); return entry; } else { Notifications
                            .error('Erro ao criar backup.'); return null; }
                },
                restoreBackup(id) {
                    return new Promise((resolve, reject) => {
                        this.showConfirmation(
                            'Deseja restaurar este backup? Os dados atuais serão substituídos.',
                            'Restaurar Backup', '🔄', 'Restaurar', 'Cancelar', false
                        ).then(() => {
                            const success = Storage.restoreBackup(id);
                            if (success) {
                                Notifications.success('Backup restaurado com sucesso!');
                                this._triggerAutoSave();
                                resolve(true);
                            } else {
                                Notifications.error('Erro ao restaurar backup.');
                                reject(new Error('Erro ao restaurar'));
                            }
                        }).catch(() => resolve(false));
                    });
                },
                restoreLatestBackup() {
                    const latest = Storage.getLatestBackup();
                    if (!latest) { Notifications.warning('Nenhum backup disponível.'); return Promise.resolve(false); }
                    return this.restoreBackup(latest.id);
                },
                getCurrentTheme: () => 'dark',
                getSettings: () => state.settings || {},
                updateSettings(settings) {
                    state.settings = { ...state.settings, ...settings };
                    Storage.saveSettings(state.settings);
                    return true;
                },
                setTitle(title) { dom.pageTitle.textContent = title || 'Game Hub'; },
                updateBreadcrumb(items) {
                    if (!items || !items.length) {
                        dom.breadcrumb.innerHTML = `<span class="crumb">Hub</span>`;
                        return;
                    }
                    let html = '';
                    items.forEach((item, idx) => {
                        if (idx > 0) html += `<span class="sep">/</span>`;
                        const isLast = idx === items.length - 1;
                        if (isLast) {
                            html += `<span class="crumb">${item}</span>`;
                        } else {
                            html += `<span class="crumb crumb-link" data-page="${item.toLowerCase()}">${item}</span>`;
                        }
                    });
                    dom.breadcrumb.innerHTML = html;
                    dom.breadcrumb.querySelectorAll('.crumb-link').forEach(el => {
                        el.addEventListener('click', () => {
                            const page = el.dataset.page;
                            if (page) Sidebar.navigate(page);
                        });
                    });
                },
                resetProject() {
                    return new Promise((resolve, reject) => {
                        this.showConfirmation(
                            'Todos os dados do projeto serão perdidos. Esta ação não pode ser desfeita.',
                            'Resetar Projeto', '⚠️', 'Resetar', 'Cancelar', true
                        ).then(() => {
                            const success = Storage.resetProject();
                            if (success) {
                                Notifications.success('Projeto resetado com sucesso!');
                                this._triggerAutoSave();
                                const current = state.currentPage || CONFIG.defaultPage;
                                PageLoader.load(current);
                                resolve(true);
                            } else {
                                Notifications.error('Erro ao resetar projeto.');
                                reject(new Error('Erro ao resetar'));
                            }
                        }).catch(() => resolve(false));
                    });
                },
                _triggerAutoSave() {
                    if (state.saveTimeout) clearTimeout(state.saveTimeout);
                    state.saveTimeout = setTimeout(() => AutoSave.save(), CONFIG.autoSaveDelay);
                },
                reloadPage() {
                    const current = state.currentPage || CONFIG.defaultPage;
                    PageLoader.load(current);
                }
            };

            // ============================================================
            // AUTO-SAVE
            // ============================================================
            const AutoSave = {
                save() {
                    if (state.isSaving) return;
                    state.isSaving = true;
                    dom.saveDot.className = 'dot saving';
                    dom.saveText.textContent = 'Salvando...';
                    try {
                        const project = Storage.getProject();
                        if (project) {
                            project.lastSaved = new Date().toISOString();
                            localStorage.setItem(CONFIG.storageKey, JSON.stringify(project));
                        }
                        dom.saveDot.className = 'dot';
                        dom.saveText.textContent = 'Salvo';
                        state.isSaving = false;
                    } catch (err) {
                        dom.saveDot.className = 'dot error';
                        dom.saveText.textContent = 'Erro';
                        state.isSaving = false;
                        console.error('Auto-save error:', err);
                    }
                },
                init() {
                    setInterval(() => { if (!state.isSaving) this.save(); }, 30000);
                    window.addEventListener('beforeunload', () => { this.save(); });
                }
            };

            // ============================================================
            // PESQUISA GLOBAL
            // ============================================================
            const GlobalSearch = {
                _input: dom.globalSearch,
                init() {
                    this._input.addEventListener('input', (e) => {
                        const query = e.target.value.trim().toLowerCase();
                        if (query.length === 0) { this._clearHighlights(); return; }
                        this._search(query);
                    });
                    this._input.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') { this._input.value = '';
                            this._clearHighlights();
                            this._input.blur(); }
                    });
                },
                _search(query) {
                    const items = dom.sidebarNav.querySelectorAll('.sidebar-item');
                    let found = false;
                    items.forEach(el => {
                        const label = el.querySelector('.label')?.textContent?.toLowerCase() || '';
                        const match = label.includes(query);
                        el.style.display = match ? '' : 'none';
                        if (match) found = true;
                    });
                    const groups = dom.sidebarNav.querySelectorAll('.sidebar-group');
                    groups.forEach(group => {
                        const hidden = group.querySelectorAll('.sidebar-item[style*="display: none"]');
                        const all = group.querySelectorAll('.sidebar-item');
                        group.style.display = (all.length > hidden.length) ? '' : 'none';
                    });
                    let msg = dom.sidebarNav.querySelector('.search-empty');
                    if (!found && query.length > 0) {
                        if (!msg) {
                            msg = document.createElement('div');
                            msg.className = 'search-empty';
                            msg.style.cssText =
                                'padding:20px 12px;color:var(--text-muted);font-size:13px;text-align:center;';
                            dom.sidebarNav.appendChild(msg);
                        }
                        msg.textContent = 'Nenhum resultado para "' + query + '"';
                    } else {
                        if (msg) msg.remove();
                    }
                },
                _clearHighlights() {
                    dom.sidebarNav.querySelectorAll('.sidebar-item').forEach(el => { el.style.display = ''; });
                    dom.sidebarNav.querySelectorAll('.sidebar-group').forEach(el => { el.style.display = ''; });
                    const msg = dom.sidebarNav.querySelector('.search-empty');
                    if (msg) msg.remove();
                }
            };

            // ============================================================
            // EVENTOS DO HEADER
            // ============================================================
            function initHeaderEvents() {
                dom.hamburger.addEventListener('click', () => Sidebar.toggle());

                dom.btnExport.addEventListener('click', () => HubAPI.exportProject());

                dom.btnImport.addEventListener('click', () => dom.fileInput.click());
                dom.fileInput.addEventListener('change', (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        HubAPI.importProject(file).then(() => HubAPI.reloadPage()).catch(() => {});
                    }
                    dom.fileInput.value = '';
                });

                dom.btnBackup.addEventListener('click', () => HubAPI.createBackup());

                dom.btnRestore.addEventListener('click', async () => {
                    const latest = Storage.getLatestBackup();
                    if (!latest) { Notifications.warning('Nenhum backup disponível.'); return; }
                    await HubAPI.restoreLatestBackup();
                    HubAPI.reloadPage();
                });

                dom.btnSettings.addEventListener('click', () => {
                    Notifications.info('Tema escuro neutro — Configurações disponíveis no localStorage.', 3000);
                });

                dom.btnReset.addEventListener('click', async () => {
                    await HubAPI.resetProject();
                    HubAPI.reloadPage();
                });

                dom.breadcrumb.addEventListener('click', (e) => {
                    const link = e.target.closest('.crumb-link');
                    if (link) {
                        const page = link.dataset.page;
                        if (page) Sidebar.navigate(page);
                    }
                });

                dom.sidebarOverlay.addEventListener('click', () => Sidebar.closeMobile());
            }

            // ============================================================
            // RESPONSIVIDADE
            // ============================================================
            function handleResize() {
                const mobile = window.innerWidth <= 768;
                const wasMobile = state.isMobile;
                state.isMobile = mobile;
                if (mobile && !wasMobile) {
                    dom.sidebar.classList.remove('collapsed');
                    dom.main.classList.remove('expanded');
                    dom.sidebar.classList.remove('open');
                    dom.sidebarOverlay.classList.remove('open');
                    state.sidebarOpen = false;
                    Sidebar._updateButtonIcon();
                } else if (!mobile && wasMobile) {
                    dom.sidebar.classList.remove('open');
                    dom.sidebarOverlay.classList.remove('open');
                    dom.sidebar.classList.remove('collapsed');
                    dom.main.classList.remove('expanded');
                    state.sidebarOpen = true;
                    Sidebar._updateButtonIcon();
                }
            }

            // ============================================================
            // HISTÓRICO
            // ============================================================
            function initHistory() {
                window.addEventListener('popstate', (e) => {
                    const page = e.state?.page || window.location.hash.replace('#', '') || CONFIG.defaultPage;
                    if (page && page !== state.currentPage) {
                        Sidebar.setActive(page);
                        PageLoader.load(page);
                    }
                });
            }

            // ============================================================
            // INICIALIZAÇÃO
            // ============================================================
            function init() {
                const savedSettings = Storage.getSettings();
                if (savedSettings) state.settings = savedSettings;
                else { state.settings = { theme: 'dark' };
                    Storage.saveSettings(state.settings); }

                Confirmation._initEvents();
                Sidebar.init();
                initHeaderEvents();
                GlobalSearch.init();
                AutoSave.init();
                initHistory();
                handleResize();
                window.addEventListener('resize', handleResize);

                state.currentPage = window.location.hash.replace('#', '') || CONFIG.defaultPage;
                window.HubAPI = HubAPI;

                setTimeout(() => {
                    Notifications.info('Game Dev Hub · Escuro Neutro', 2500);
                }, 500);

                console.log('📦 Game Dev Hub v2 (iframe)');
                console.log('📄 Página atual:', state.currentPage);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init();
            }

        })();
    </script>
</body>
</html>
