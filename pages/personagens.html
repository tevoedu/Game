<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personagens · Bíblia Visual</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ============================================================
           CONFIGURAÇÕES GERAIS — MODO ESCURO CINEMATOGRÁFICO
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-page: #08080f;
            --bg-secondary: #101018;
            --bg-card: #181826;
            --bg-input: #222234;
            --border-light: #2c2c42;
            --border-medium: #464660;
            --text-primary: #eeeef6;
            --text-secondary: #b8b8cc;
            --text-muted: #707088;
            --accent: #e2a654;
            --accent-dim: rgba(226, 166, 84, 0.07);
            --accent-light: #f2d49e;
            --accent-glow: rgba(226, 166, 84, 0.18);
            --shadow-soft: 0 4px 24px rgba(0, 0, 0, 0.55);
            --shadow-card: 0 2px 12px rgba(0, 0, 0, 0.4);
            --radius-md: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
            --transition: 0.25s ease;
            --font-serif: 'Playfair Display', serif;
            --font-sans: 'Inter', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 32px 28px 60px;
            background-image:
                radial-gradient(ellipse at 30% 10%, rgba(226, 166, 84, 0.03) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(120, 120, 200, 0.03) 0%, transparent 60%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.025'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            line-height: 1.5;
            background-attachment: fixed;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--border-medium);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ============================================================
           UTILITÁRIOS
           ============================================================ */
        .hidden {
            display: none !important;
        }
        .flex {
            display: flex;
        }
        .flex-col {
            flex-direction: column;
        }
        .items-center {
            align-items: center;
        }
        .justify-between {
            justify-content: space-between;
        }
        .gap-2 {
            gap: 8px;
        }
        .gap-3 {
            gap: 12px;
        }
        .gap-4 {
            gap: 16px;
        }
        .gap-6 {
            gap: 24px;
        }
        .flex-wrap {
            flex-wrap: wrap;
        }
        .flex-1 {
            flex: 1;
        }
        .text-center {
            text-align: center;
        }
        .w-full {
            width: 100%;
        }
        .relative {
            position: relative;
        }
        .mt-2 {
            margin-top: 8px;
        }
        .mt-4 {
            margin-top: 16px;
        }
        .mt-6 {
            margin-top: 24px;
        }
        .mb-2 {
            margin-bottom: 8px;
        }
        .mb-4 {
            margin-bottom: 16px;
        }

        /* ============================================================
           TIPOGRAFIA
           ============================================================ */
        .heading-xl {
            font-family: var(--font-serif);
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-primary);
            background: linear-gradient(135deg, #f0e0c0 0%, #e2a654 60%, #c88840 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .heading-lg {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .heading-md {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .heading-sm {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }
        .body-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        .text-accent {
            color: var(--accent);
        }
        .text-muted {
            color: var(--text-muted);
        }

        /* ============================================================
           BOTÕES
           ============================================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.85rem;
            border: 1px solid var(--border-light);
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            background: var(--bg-card);
            color: var(--text-primary);
            box-shadow: var(--shadow-card);
            letter-spacing: 0.01em;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
            border-color: var(--border-medium);
        }

        .btn-primary {
            background: linear-gradient(135deg, #e2a654 0%, #c88840 100%);
            color: #0a0a12;
            border: none;
            font-weight: 600;
            box-shadow: 0 4px 16px var(--accent-glow);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #ecb464 0%, #d49448 100%);
            box-shadow: 0 6px 24px rgba(226, 166, 84, 0.3);
            transform: translateY(-2px);
        }

        .btn-gold {
            background: #c9a87c;
            color: #0a0a12;
            border: none;
        }
        .btn-gold:hover {
            background: #b8976a;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border-light);
        }
        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.03);
            border-color: var(--border-medium);
        }

        .btn-danger {
            background: rgba(220, 70, 60, 0.12);
            color: #e8908a;
            border: 1px solid rgba(220, 70, 60, 0.2);
        }
        .btn-danger:hover {
            background: rgba(220, 70, 60, 0.22);
            border-color: rgba(220, 70, 60, 0.35);
            color: #f0a8a2;
        }

        .btn-sm {
            padding: 4px 14px;
            font-size: 0.75rem;
        }
        .btn-xs {
            padding: 2px 10px;
            font-size: 0.65rem;
            border-radius: 20px;
        }

        /* ============================================================
           HEADER DO MÓDULO
           ============================================================ */
        .module-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            padding: 24px 28px;
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            margin-bottom: 28px;
            box-shadow: var(--shadow-soft);
            position: relative;
            backdrop-filter: blur(4px);
        }
        .module-header .header-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .module-header .header-left .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 400;
        }
        .module-header .header-left .subtitle i {
            color: var(--accent);
            margin-right: 6px;
        }
        .module-header .header-stats {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }
        .module-header .header-stats .stat {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .module-header .header-stats .stat strong {
            color: var(--text-primary);
            font-size: 1.2rem;
        }
        .module-header .header-stats .stat i {
            color: var(--accent);
            font-size: 1rem;
        }
        .module-header .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ============================================================
           BUSCA E FILTROS
           ============================================================ */
        .search-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 24px;
            padding: 12px 18px;
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-card);
        }
        .search-bar .search-input-wrap {
            flex: 1;
            min-width: 180px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-input);
            border-radius: 30px;
            padding: 0 16px;
            border: 1px solid var(--border-light);
            transition: var(--transition);
        }
        .search-bar .search-input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .search-bar .search-input-wrap i {
            color: var(--accent);
            font-size: 0.85rem;
        }
        .search-bar .search-input-wrap input {
            background: transparent;
            border: none;
            padding: 8px 0;
            color: var(--text-primary);
            font-size: 0.9rem;
            width: 100%;
            outline: none;
            font-family: var(--font-sans);
        }
        .search-bar .search-input-wrap input::placeholder {
            color: var(--text-muted);
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
            flex: 1 1 100%;
        }
        .filter-bar .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex: 1;
        }
        .filter-bar .filter-btn {
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-light);
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: var(--font-sans);
            white-space: nowrap;
        }
        .filter-bar .filter-btn:hover {
            background: var(--bg-input);
            border-color: var(--border-medium);
            color: var(--text-primary);
        }
        .filter-bar .filter-btn.active {
            background: linear-gradient(135deg, #e2a654 0%, #c88840 100%);
            border-color: var(--accent);
            color: #0a0a12;
            font-weight: 600;
            box-shadow: 0 2px 10px var(--accent-glow);
        }
        .filter-bar .filter-btn .tag-remove {
            margin-left: 4px;
            opacity: 0.5;
            font-size: 0.6rem;
            pointer-events: none;
        }
        .filter-bar .manage-tags-btn {
            margin-left: 4px;
        }

        /* ============================================================
           GALERIA — CARDS
           ============================================================ */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            margin-top: 8px;
        }

        .character-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            overflow: hidden;
            border: 1px solid var(--border-light);
            transition: var(--transition);
            cursor: pointer;
            box-shadow: var(--shadow-card);
            position: relative;
        }
        .character-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-lg);
            opacity: 0;
            transition: opacity 0.35s ease;
            background: radial-gradient(circle at 50% 0%, var(--accent-glow) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
        }
        .character-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-medium);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        }
        .character-card:hover::before {
            opacity: 1;
        }
        .character-card .card-image {
            width: 100%;
            aspect-ratio: 1/1;
            background: var(--bg-input);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 0;
        }
        .character-card .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }
        .character-card:hover .card-image img {
            transform: scale(1.04);
        }
        .character-card .card-image .card-role-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            padding: 3px 12px;
            border-radius: 30px;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: rgba(10, 10, 18, 0.88);
            backdrop-filter: blur(6px);
            border: 1px solid var(--border-light);
            color: var(--text-secondary);
            z-index: 2;
        }
        .character-card .card-image .card-role-badge.protagonista {
            color: #f0c060;
            border-color: #e2a654;
            box-shadow: 0 0 12px rgba(226, 166, 84, 0.25);
        }
        .character-card .card-image .card-role-badge.antagonista {
            color: #f06868;
            border-color: #c0392b;
            box-shadow: 0 0 12px rgba(192, 57, 43, 0.2);
        }
        .character-card .card-image .card-role-badge.aliado {
            color: #5ec9b8;
            border-color: #1a8a7a;
            box-shadow: 0 0 12px rgba(26, 138, 122, 0.2);
        }
        .character-card .card-image .card-role-badge.inimigo {
            color: #f0a040;
            border-color: #c07020;
            box-shadow: 0 0 12px rgba(192, 112, 32, 0.2);
        }
        .character-card .card-image .card-role-badge.npc {
            color: #9090b0;
            border-color: #5a5a7a;
        }

        .character-card .card-body {
            padding: 16px 18px 18px;
            position: relative;
            z-index: 0;
        }
        .character-card .card-body .card-name {
            font-family: var(--font-serif);
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        .character-card .card-body .card-name .color-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1px solid var(--border-light);
            box-shadow: 0 0 8px currentColor;
        }
        .character-card .card-body .card-sub {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 2px 0 8px;
        }
        .character-card .card-body .card-sub span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .character-card .card-body .card-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }
        .character-card .card-body .card-actions {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            opacity: 0;
            transform: translateY(4px);
            transition: var(--transition);
        }
        .character-card:hover .card-body .card-actions {
            opacity: 1;
            transform: translateY(0);
        }
        .character-card .card-body .card-actions .btn {
            flex: 1;
            justify-content: center;
            padding: 4px 10px;
            font-size: 0.7rem;
        }

        .character-card .card-color-bar {
            height: 4px;
            width: 100%;
            transition: var(--transition);
            position: relative;
            z-index: 0;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 4rem;
            color: var(--border-light);
            margin-bottom: 16px;
            display: block;
        }
        .empty-state h3 {
            font-size: 1.3rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        /* ============================================================
           MODAL — CADASTRO / EDIÇÃO
           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 4, 10, 0.78);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            max-width: 820px;
            width: 100%;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-light);
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.7);
            transform: scale(0.96) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
        }
        .modal-overlay.open .modal {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-light);
            flex-shrink: 0;
            background: var(--bg-secondary);
        }
        .modal-header h2 {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
        }
        .modal-header h2 i {
            color: var(--accent);
        }
        .modal-header .btn-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: var(--transition);
        }
        .modal-header .btn-close:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.04);
        }

        .modal-body {
            padding: 20px 24px 24px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-body .form-section {
            margin-bottom: 24px;
        }
        .modal-body .form-section .section-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--accent);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 6px;
        }
        .modal-body .form-section .section-title i {
            color: var(--accent);
        }

        .modal-body .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .modal-body .form-row.single {
            grid-template-columns: 1fr;
        }
        .modal-body .form-row.triple {
            grid-template-columns: 1fr 1fr 1fr;
        }

        .modal-body .form-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .modal-body .form-group label {
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }
        .modal-body .form-group input,
        .modal-body .form-group textarea,
        .modal-body .form-group select {
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.9rem;
            transition: var(--transition);
            outline: none;
            width: 100%;
        }
        .modal-body .form-group input:focus,
        .modal-body .form-group textarea:focus,
        .modal-body .form-group select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
            background: var(--bg-card);
        }
        .modal-body .form-group textarea {
            min-height: 50px;
            resize: vertical;
        }
        .modal-body .form-group input[type="color"] {
            padding: 2px;
            height: 40px;
            cursor: pointer;
            border-radius: var(--radius-sm);
        }

        .image-upload-area {
            border: 2px dashed var(--border-light);
            border-radius: var(--radius-sm);
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-input);
        }
        .image-upload-area:hover {
            border-color: var(--accent);
            background: rgba(226, 166, 84, 0.04);
        }
        .image-upload-area i {
            font-size: 1.8rem;
            color: var(--accent);
            display: block;
            margin-bottom: 2px;
        }
        .image-upload-area p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .image-upload-area input[type="file"] {
            display: none;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 14px 24px 20px;
            border-top: 1px solid var(--border-light);
            flex-shrink: 0;
            background: var(--bg-secondary);
        }

        /* ============================================================
           PÁGINA INDIVIDUAL DO PERSONAGEM
           ============================================================ */
        .character-detail-overlay {
            position: fixed;
            inset: 0;
            background: rgba(4, 4, 10, 0.78);

<body>

    <!-- ============================================================
    CONTAINER PRINCIPAL
    ============================================================ -->
    <div id="app">

        <header class="module-header" id="moduleHeader">
            <div class="header-left">
                <h1 class="heading-xl">Personagens</h1>

                    </button>

            </div>
            <div class="header-stats">

                    <i class="fas fa-users"></i>
                    <strong id="totalCount">0</strong>
                    <span>personagens</span>

                </div>

                    <i class="fas fa-tags"></i>
                </button>
            </div>
        </div>

        <div class="gallery-grid" id="galleryGrid">
            <!-- renderizado via JS -->
        </div>

        <div class="modal">
            <div class="modal-header">
                <h2><i class="fas fa-user-plus"></i> <span id="formModalTitle">Novo Personagem</span></h2>

            </div>

                <!-- formulário gerado via JS -->
            </div>

    </div>

            <div class="modal-header">
                <h2><i class="fas fa-tags"></i> Gerenciar Tags</h2>

            </div>
            <div class="modal-body">
                <p class="text-muted" style="margin-bottom:16px; font-size:0.9rem;">

                    <!-- renderizado via JS -->
                </div>
                <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">

                </div>
                <div style="margin-top:12px; font-size:0.75rem; color:var(--text-muted);">

                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" id="tagManagerSaveBtn">Concluir</button>
            </div>

            <!-- renderizado via JS -->
        </div>

        <button class="lb-close" id="lbClose"><i class="fas fa-times"></i></button>
        <div class="lb-content">
            <img id="lbImage" src="" alt="" />
        </div>
        <div class="lb-caption" id="lbCaption"></div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-container" id="toastContainer"></div>


    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        /* ==============================================================
               CONFIGURAÇÕES
               ============================================================== */
        const STORAGE_KEY = 'personagens_data';
        const SUBTITLE_KEY = 'personagens_subtitle';
        const TAGS_KEY = 'personagens_tags';

        /* ==============================================================
               ESTADO
               ============================================================== */
        let state = {
            characters: [],
            subtitle: 'Conheça os habitantes deste universo.',
            currentFilter: 'todos',
            searchQuery: '',
            editingId: null,
            viewingId: null,
            tags: ['todos', 'protagonista', 'antagonista', 'aliado', 'inimigo', 'npc'],
        };

        /* ==============================================================
               UTILITÁRIOS
               ============================================================== */
        function uid() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        function deepClone(obj) {
            return JSON.parse(JSON.stringify(obj));
        }

        function truncate(str, n = 80) {
            if (!str) return '';
            return str.length > n ? str.slice(0, n) + '…' : str;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('pt-BR');
        }

        function getRoleLabel(role) {
            if (role === 'todos') return 'Todos';
            const found = state.tags.find(t => t.toLowerCase() === role.toLowerCase());
            if (found && found !== 'todos') return found.charAt(0).toUpperCase() + found.slice(1);
            return role ? role.charAt(0).toUpperCase() + role.slice(1) : 'NPC';
        }

        function getRoleColor(role) {
            const map = {
                protagonista: '#f0c060',
                antagonista: '#f06868',
                aliado: '#5ec9b8',
                inimigo: '#f0a040',
                npc: '#9090b0'
            };
            const lower = role.toLowerCase();
            if (map[lower]) return map[lower];
            let hash = 0;
            for (let i = 0; i < role.length; i++) {
                hash = role.charCodeAt(i) + ((hash << 5) - hash);
            }
            const hue = Math.abs(hash) % 360;
            return `hsl(${hue}, 50%, 62%)`;
        }

        function toast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            const iconMap = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                info: 'fa-info-circle'
            };
            el.innerHTML = `<i class="fas ${iconMap[type] || iconMap.info}"></i> ${message}`;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px) scale(0.96)';
                el.style.transition = '0.3s ease';
                setTimeout(() => el.remove(), 300);
            }, 3500);
        }

        /* ==============================================================
               ARMAZENAMENTO
               ============================================================== */
        function saveState() {
            try {
                const data = {
                    characters: state.characters,
                    subtitle: state.subtitle,
                    tags: state.tags,
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                localStorage.setItem(TAGS_KEY, JSON.stringify(state.tags));
            } catch (e) {
                console.warn('Erro ao salvar:', e);
            }
        }

        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    state.characters = data.characters || [];
                    state.subtitle = data.subtitle || 'Conheça os habitantes deste universo.';
                    if (data.tags && data.tags.length > 0) {
                        state.tags = data.tags;
                        if (!state.tags.includes('todos')) state.tags.unshift('todos');
                    } else {
                        state.tags = ['todos', 'protagonista', 'antagonista', 'aliado', 'inimigo', 'npc'];
                    }
                    return true;
                }
            } catch (e) {
                console.warn('Erro ao carregar:', e);
            }
            return false;
        }

        function loadTags() {
            try {
                const raw = localStorage.getItem(TAGS_KEY);
                if (raw) {
                    const tags = JSON.parse(raw);
                    if (tags && tags.length > 0) {
                        state.tags = tags;
                        if (!state.tags.includes('todos')) state.tags.unshift('todos');
                        return;
                    }
                }
            } catch (e) { /* ignore */ }
            state.tags = ['todos', 'protagonista', 'antagonista', 'aliado', 'inimigo', 'npc'];
        }

        function loadSubtitle() {
            try {
                const val = localStorage.getItem(SUBTITLE_KEY);
                if (val) state.subtitle = val;
            } catch (e) { /* ignore */ }
        }

        function saveSubtitle() {
            try {
                localStorage.setItem(SUBTITLE_KEY, state.subtitle);
            } catch (e) { /* ignore */ }
        }

        /* ==============================================================
               CRIAÇÃO DE PERSONAGEM VAZIO
               ============================================================== */
        function createEmptyCharacter() {
            const defaultRole = state.tags.find(t => t !== 'todos') || 'npc';
            return {
                id: uid(),
                name: '',
                age: '',
                birthDate: '',
                nickname: '',
                pronouns: '',
                species: '',
                role: defaultRole,
                description: '',
                physicalDescription: '',
                height: '',
                distinctiveFeatures: '',
                clothing: '',
                visualStyle: '',
                importantVisualElements: '',
                personality: '',
                qualities: '',
                flaws: '',
                fears: '',
                desires: '',
                motivations: '',
                internalConflicts: '',
                past: '',
                origin: '',
                childhood: '',
                importantEvents: '',
                traumas: '',
                decisiveMoments: '',
                narrativeImportance: '',
                objective: '',
                characterArc: '',
                transformation: '',
                chapterParticipation: '',
                mysteries: '',
                relationships: [],
                likes: '',
                dislikes: '',
                habits: '',
                quirks: '',
                curiosities: '',
                catchphrases: '',
                profileImage: '',
                conceptArts: [],
                visualReferences: [],
                timeline: [],

                secondaryColor: '#707088',

                updatedAt: new Date().toISOString(),
            };
        }

        /* ==============================================================
               RENDERIZAÇÃO — FILTROS
               ============================================================== */
        function renderFilters() {
            const container = document.getElementById('filterGroup');
            let html = '';
            state.tags.forEach(tag => {
                const isActive = state.currentFilter === tag ? 'active' : '';
                const label = tag === 'todos' ? 'Todos' : tag.charAt(0).toUpperCase() + tag.slice(1);
                html += `<button class="filter-btn ${isActive}" data-filter="${tag}">${label}</button>`;
            });
            container.innerHTML = html;

            container.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.currentFilter = btn.dataset.filter;
                    renderGallery();
                });
            });
        }

        /* ==============================================================
               RENDERIZAÇÃO — GALERIA
               ============================================================== */
        function renderGallery() {
            const grid = document.getElementById('galleryGrid');
            const filtered = getFilteredCharacters();

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-user-astronaut"></i>
                        <h3>Nenhum personagem encontrado</h3>
                        <p class="text-muted">Crie seu primeiro personagem para começar a povoar o universo.</p>
                        <button class="btn btn-primary mt-4" id="emptyNewBtn">
                            <i class="fas fa-plus"></i> Criar Personagem
                        </button>
                    </div>
                `;
                const emptyBtn = document.getElementById('emptyNewBtn');
                if (emptyBtn) emptyBtn.addEventListener('click', () => openForm());
                updateStats();
                return;
            }

            let html = '';
            filtered.forEach(char => {
                const roleLabel = getRoleLabel(char.role);
                const roleColor = getRoleColor(char.role);
                const primary = char.primaryColor || '#e2a654';
                const hasImage = char.profileImage && char.profileImage.length > 0;

                html += `
                    <div class="character-card" data-id="${char.id}" data-role="${char.role}">
                        <div class="card-image">
                            ${hasImage ? `<img src="${char.profileImage}" alt="${escapeHtml(char.name)}" loading="lazy" />` :
                                `<div class="no-image-placeholder"><i class="fas fa-user"></i></div>`}
                            <span class="card-role-badge ${char.role}">
                                ${roleLabel}
                            </span>
                        </div>
                        <div class="card-body">
                            <div class="card-name">
                                <span class="color-dot" style="background:${primary};"></span>
                                ${escapeHtml(char.name) || 'Sem nome'}
                            </div>
                            <div class="card-sub">
                                <span><i class="fas fa-calendar-alt"></i> ${escapeHtml(char.age) || '—'}</span>
                                ${char.species ? `<span><i class="fas fa-tag"></i> ${escapeHtml(char.species)}</span>` : ''}
                            </div>
                            <div class="card-desc">${char.description ? truncate(escapeHtml(char.description), 90) : 'Sem descrição'}</div>
                            <div class="card-actions">
                                <button class="btn btn-ghost btn-sm detail-btn" data-id="${char.id}">
                                    <i class="fas fa-eye"></i> Ver
                                </button>
                                <button class="btn btn-ghost btn-sm edit-btn" data-id="${char.id}">
                                    <i class="fas fa-pen"></i> Editar
                                </button>
                                <button class="btn btn-danger btn-sm delete-btn" data-id="${char.id}">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                        <div class="card-color-bar" style="background:linear-gradient(90deg, ${primary}, ${char.secondaryColor || primary});"></div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            updateStats();

            grid.querySelectorAll('.detail-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    openDetail(id);
                });
            });
            grid.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    openForm(id);
                });
            });
            grid.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    deleteCharacter(id);
                });
            });
            grid.querySelectorAll('.character-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    if (e.target.closest('button')) return;
                    const id = card.dataset.id;
                    openDetail(id);
                });
            });
        }

        function updateStats() {
            const total = state.characters.length;
            document.getElementById('totalCount').textContent = total;
        }

        function getFilteredCharacters() {
            let list = [...state.characters];
            if (state.currentFilter !== 'todos') {
                list = list.filter(c => c.role === state.currentFilter);
            }
            if (state.searchQuery.trim()) {
                const q = state.searchQuery.trim().toLowerCase();
                list = list.filter(c =>
                    c.name.toLowerCase().includes(q) ||
                    (c.description && c.description.toLowerCase().includes(q)) ||
                    (c.species && c.species.toLowerCase().includes(q)) ||
                    (c.nickname && c.nickname.toLowerCase().includes(q))
                );
            }
            return list;
        }

        /* ==============================================================
               BUILD ROLE OPTIONS
               ============================================================== */
        function buildRoleOptions(selected) {
            let html = '';
            const roleTags = state.tags.filter(t => t !== 'todos');
            roleTags.forEach(tag => {
                const label = tag.charAt(0).toUpperCase() + tag.slice(1);
                const sel = (selected === tag) ? 'selected' : '';
                html += `<option value="${tag}" ${sel}>${label}</option>`;
            });
            return html;
        }

        /* ==============================================================
               FORMULÁRIO — MODAL
               ============================================================== */
        function openForm(editId = null) {
            const modal = document.getElementById('formModal');
            const title = document.getElementById('formModalTitle');
            const body = document.getElementById('formBody');

            state.editingId = editId || null;

            let char;
            if (editId) {
                char = state.characters.find(c => c.id === editId);
                if (!char) {
                    toast('Personagem não encontrado.', 'error');
                    return;
                }
                title.innerHTML = `<i class="fas fa-user-edit"></i> Editar Personagem`;
            } else {
                char = createEmptyCharacter();
                title.innerHTML = `<i class="fas fa-user-plus"></i> Novo Personagem`;
            }

            body.innerHTML = buildFormHTML(char);
            setupFormEvents(char);

            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function buildFormHTML(char) {

                const valueAttr = isTextarea ? '' : `value="${escapeHtml(val)}"`;
                const content = isTextarea ? escapeHtml(val) : '';
                return `
                    <div class="form-group">
                        <label>${label}</label>

                </div>

            const arts = char.conceptArts || [];

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        function saveFormData(char) {
            const fields = ['name', 'age', 'birthDate', 'nickname', 'pronouns', 'species', 'description',
                'physicalDescription', 'height', 'distinctiveFeatures', 'clothing', 'visualStyle',
                'importantVisualElements', 'personality', 'qualities', 'flaws', 'fears', 'desires',
                'motivations', 'internalConflicts', 'past', 'origin', 'childhood', 'importantEvents',
                'traumas', 'decisiveMoments', 'narrativeImportance', 'objective', 'characterArc',
                'transformation', 'chapterParticipation', 'mysteries', 'likes', 'dislikes', 'habits',
                'quirks', 'curiosities', 'catchphrases'
            ];

            fields.forEach(key => {
                const el = document.getElementById(`field_${key}`);
                if (el) {
                    char[key] = el.value;
                }
            });

            const roleEl = document.getElementById('field_role');
            if (roleEl) {
                const newRole = roleEl.value;
                if (state.tags.includes(newRole) && newRole !== 'todos') {
                    char.role = newRole;
                } else {
                    const fallback = state.tags.find(t => t !== 'todos') || 'npc';
                    char.role = fallback;
                    toast('Papel ajustado para "' + fallback + '" pois a tag anterior foi removida.', 'info');
                }
            }

            const primaryEl = document.getElementById('field_primaryColor');
            const secondaryEl = document.getElementById('field_secondaryColor');
            if (primaryEl) char.primaryColor = primaryEl.value;
            if (secondaryEl) char.secondaryColor = secondaryEl.value;

            const relContainer = document.getElementById('relationsContainer');
            const relItems = relContainer ? relContainer.querySelectorAll('.form-row.single') : [];
            char.relationships = [];
            relItems.forEach(el => {
                const name = el.querySelector('.rel-name')?.value || '';
                const type = el.querySelector('.rel-type')?.value || '';
                const desc = el.querySelector('.rel-desc')?.value || '';
                if (name.trim() || type.trim() || desc.trim()) {
                    char.relationships.push({ characterName: name, relationshipType: type, description: desc });
                }
            });

            const tlContainer = document.getElementById('timelineContainer');
            const tlItems = tlContainer ? tlContainer.querySelectorAll('.form-row.single') : [];
            char.timeline = [];
            tlItems.forEach(el => {
                const date = el.querySelector('.tl-date')?.value || '';
                const title = el.querySelector('.tl-title')?.value || '';
                const desc = el.querySelector('.tl-desc')?.value || '';
                const image = el.dataset.tlImage || '';
                if (date.trim() || title.trim() || desc.trim()) {
                    char.timeline.push({ date, title, description: desc, image });
                }
            });

            const artContainer = document.getElementById('conceptArtsContainer');
            const artItems = artContainer ? artContainer.querySelectorAll('.form-row.single') : [];
            char.conceptArts = [];
            artItems.forEach(el => {
                const title = el.querySelector('.art-title')?.value || '';
                const desc = el.querySelector('.art-desc')?.value || '';
                const image = el.dataset.artImage || '';
                if (title.trim() || desc.trim() || image) {
                    char.conceptArts.push({ id: uid(), title, description: desc, image });
                }
            });

            const refContainer = document.getElementById('visualRefsContainer');
            const refItems = refContainer ? refContainer.querySelectorAll('.form-row.single') : [];
            char.visualReferences = [];
            refItems.forEach(el => {
                const title = el.querySelector('.ref-title')?.value || '';
                const desc = el.querySelector('.ref-desc')?.value || '';
                const image = el.dataset.refImage || '';
                if (title.trim() || desc.trim() || image) {
                    char.visualReferences.push({ id: uid(), title, description: desc, image });
                }
            });

            if (!char.name.trim()) {
                toast('O nome do personagem é obrigatório.', 'error');
                return;
            }

            char.updatedAt = new Date().toISOString();

            if (state.editingId) {
                const idx = state.characters.findIndex(c => c.id === state.editingId);
                if (idx !== -1) {
                    state.characters[idx] = char;
                    toast('Personagem atualizado com sucesso!', 'success');
                } else {
                    toast('Erro ao atualizar personagem.', 'error');
                    return;
                }
            } else {
                char.createdAt = new Date().toISOString();
                state.characters.push(char);
                toast('Personagem criado com sucesso!', 'success');
            }

            saveState();
            renderGallery();

            document.getElementById('formModal').classList.remove('open');
            document.body.style.overflow = '';
            state.editingId = null;
        }

        function deleteCharacter(id) {
            const char = state.characters.find(c => c.id === id);
            if (!char) return;
            if (!confirm(`Tem certeza que deseja excluir "${char.name || 'este personagem'}"?`)) return;
            state.characters = state.characters.filter(c => c.id !== id);
            saveState();
            renderGallery();
            toast('Personagem removido.', 'info');
        }

        function duplicateCharacter(id) {
            const original = state.characters.find(c => c.id === id);
            if (!original) return;
            const copy = deepClone(original);
            copy.id = uid();
            copy.name = copy.name + ' (cópia)';
            copy.createdAt = new Date().toISOString();
            copy.updatedAt = new Date().toISOString();
            state.characters.push(copy);
            saveState();
            renderGallery();
            toast('Personagem duplicado!', 'success');
        }

        function openDetail(id) {
            const char = state.characters.find(c => c.id === id);
            if (!char) {
                toast('Personagem não encontrado.', 'error');
                return;
            }
            state.viewingId = id;
            const overlay = document.getElementById('detailOverlay');
            const container = document.getElementById('detailContainer');

            container.innerHTML = buildDetailHTML(char);
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';

            container.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    container.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    const target = document.getElementById(btn.dataset.tab);
                    if (target) target.classList.add('active');
                });
            });

            const closeBtn = container.querySelector('.detail-close');
            if (closeBtn) {
                closeBtn.addEventListener('click', closeDetail);
            }
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeDetail();
            });

            container.querySelectorAll('.gallery-item').forEach(item => {
                item.addEventListener('click', () => {
                    const img = item.querySelector('img');
                    if (img) openLightbox(img.src, item.dataset.label || '');
                });
            });

            const editBtn = container.querySelector('.detail-edit-btn');
            if (editBtn) {
                editBtn.addEventListener('click', () => {
                    closeDetail();
                    setTimeout(() => openForm(char.id), 350);
                });
            }
            const dupBtn = container.querySelector('.detail-duplicate-btn');
            if (dupBtn) {
                dupBtn.addEventListener('click', () => {
                    duplicateCharacter(char.id);
                    closeDetail();
                });
            }
            const delBtn = container.querySelector('.detail-delete-btn');
            if (delBtn) {
                delBtn.addEventListener('click', () => {
                    closeDetail();
                    setTimeout(() => deleteCharacter(char.id), 300);
                });
            }
        }

        function closeDetail() {
            document.getElementById('detailOverlay').classList.remove('open');
            document.body.style.overflow = '';
            state.viewingId = null;
        }

        function buildDetailHTML(char) {
            const primary = char.primaryColor || '#e2a654';
            const secondary = char.secondaryColor || '#707088';
            const roleLabel = getRoleLabel(char.role);
            const roleColor = getRoleColor(char.role);
            const hasProfile = char.profileImage && char.profileImage.length > 0;
            const hasCover = char.visualReferences && char.visualReferences.length > 0 && char.visualReferences[0].image;

            let relHtml = '';
            if (char.relationships && char.relationships.length > 0) {
                relHtml = `<div class="rel-grid">`;
                char.relationships.forEach(r => {
                    relHtml += `
                        <div class="rel-card">
                            <div class="rel-name">${escapeHtml(r.characterName || '—')}</div>
                            <div class="rel-type">${escapeHtml(r.relationshipType || '')}</div>
                            <div class="rel-desc">${escapeHtml(r.description || '')}</div>
                        </div>`;
                });
                relHtml += `</div>`;
            } else {
                relHtml = `<p class="text-muted">Nenhuma relação cadastrada.</p>`;
            }

            let tlHtml = '';
            if (char.timeline && char.timeline.length > 0) {
                tlHtml = `<div class="timeline-list">`;
                char.timeline.forEach(t => {
                    tlHtml += `
                        <div class="tl-item">
                            <div class="tl-date">${escapeHtml(t.date || '')}</div>
                            <div class="tl-content">
                                <div class="tl-title">${escapeHtml(t.title || '')}</div>
                                <div class="tl-desc">${escapeHtml(t.description || '')}</div>
                                ${t.image ? `<img src="${t.image}" class="tl-img" alt="" />` : ''}
                            </div>
                        </div>`;
                });
                tlHtml += `</div>`;
            } else {
                tlHtml = `<p class="text-muted">Nenhum evento na timeline.</p>`;
            }

            let galleryItems = [];
            if (char.conceptArts) {
                char.conceptArts.forEach(a => { if (a.image) galleryItems.push({ image: a.image, label: a.title || 'Concept Art' }); });
            }
            if (char.visualReferences) {
                char.visualReferences.forEach(r => { if (r.image) galleryItems.push({ image: r.image, label: r.title || 'Referência' }); });
            }
            let galleryHtml = galleryItems.length > 0
                ? `<div class="detail-gallery-grid">${galleryItems.map(item => `
                    <div class="gallery-item" data-label="${escapeHtml(item.label)}">
                        <img src="${item.image}" alt="${escapeHtml(item.label)}" loading="lazy" />
                        <div class="gallery-label">${escapeHtml(item.label)}</div>
                    </div>`).join('')}</div>`
                : `<p class="text-muted">Nenhuma imagem na galeria.</p>`;

            return `
                <div class="detail-header">
                    <div class="cover">
                        ${hasCover ? `<img src="${char.visualReferences[0].image}" alt="" />` : ''}
                        <div class="cover-color" style="background:linear-gradient(135deg, ${primary}66, ${secondary}55);"></div>
                    </div>
                    <button class="detail-close"><i class="fas fa-times"></i></button>
                    <div class="detail-profile">
                        <div class="avatar">
                            ${hasProfile ? `<img src="${char.profileImage}" alt="${escapeHtml(char.name)}" />` : `<div class="no-image-placeholder" style="font-size:2.5rem;"><i class="fas fa-user"></i></div>`}
                        </div>
                        <div class="profile-info">
                            <div class="name">
                                ${escapeHtml(char.name) || 'Sem nome'}
                                <span class="color-dot" style="background:${primary}; width:14px; height:14px;"></span>
                            </div>
                            <div class="sub">
                                <span><i class="fas fa-tag" style="color:${roleColor};"></i> ${roleLabel}</span>
                                ${char.age ? `<span><i class="fas fa-calendar-alt"></i> ${escapeHtml(char.age)} anos</span>` : ''}
                                ${char.species ? `<span><i class="fas fa-dna"></i> ${escapeHtml(char.species)}</span>` : ''}
                                ${char.nickname ? `<span><i class="fas fa-star"></i> "${escapeHtml(char.nickname)}"</span>` : ''}
                            </div>
                            ${char.catchphrases ? `<div class="catchphrase">"${escapeHtml(char.catchphrases)}"</div>` : ''}
                            <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">

        function openLightbox(src, caption) {
            const overlay = document.getElementById('lightboxOverlay');
            document.getElementById('lbImage').src = src;
            document.getElementById('lbCaption').textContent = caption || '';
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            document.getElementById('lightboxOverlay').classList.remove('open');
            document.body.style.overflow = '';
        }
        document.getElementById('lbClose').addEventListener('click', closeLightbox);
        document.getElementById('lightboxOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeLightbox();
        });

        function renderTagManager() {
            const list = document.getElementById('tagManagerList');
            let html = '';
            state.tags.forEach(tag => {
                const isTodos = tag === 'todos';
                html += `
                    <div class="tag-manager-item" data-tag="${tag}">
                        <input type="text" class="tag-input" value="${tag}" ${isTodos ? 'disabled' : ''} />
                        <div class="tag-actions">
                            ${!isTodos ? `<button class="btn btn-danger btn-xs remove-tag-btn"><i class="fas fa-times"></i></button>` : ''}
                        </div>
                    </div>`;
            });
            list.innerHTML = html;
            list.querySelectorAll('.remove-tag-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const item = btn.closest('.tag-manager-item');
                    const tag = item.dataset.tag;
                    if (tag === 'todos') return;
                    const uses = state.characters.some(c => c.role === tag);
                    if (uses && !confirm(`A tag "${tag}" está sendo usada por personagens. Removê-la alterará o papel deles para o padrão. Continuar?`)) return;
                    state.tags = state.tags.filter(t => t !== tag);
                    const fallback = state.tags.find(t => t !== 'todos') || 'npc';
                    state.characters.forEach(c => { if (c.role === tag) c.role = fallback; });
                    renderTagManager();
                    renderFilters();
                    renderGallery();
                    saveState();
                    toast(`Tag "${tag}" removida.`, 'info');
                });
            });
            list.querySelectorAll('.tag-input:not([disabled])').forEach(input => {
                input.addEventListener('change', () => {
                    const newVal = input.value.trim().toLowerCase();
                    const oldTag = input.closest('.tag-manager-item').dataset.tag;
                    if (!newVal || newVal === 'todos') { toast('Tag inválida.', 'error');
                        input.value = oldTag; return; }
                    if (newVal !== oldTag && state.tags.includes(newVal)) { toast('Tag já existe.', 'error');
                        input.value = oldTag; return; }
                    const idx = state.tags.indexOf(oldTag);
                    if (idx !== -1) {
                        state.tags[idx] = newVal;
                        state.characters.forEach(c => { if (c.role === oldTag) c.role = newVal; });
                        if (state.currentFilter === oldTag) state.currentFilter = newVal;
                        renderTagManager();
                        renderFilters();
                        renderGallery();
                        saveState();
                        toast(`Tag "${oldTag}" alterada para "${newVal}".`, 'success');
                    }
                });
            });
        }

        function openTagManager() {
            const modal = document.getElementById('tagManagerModal');
            renderTagManager();
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeTagManager() {
            document.getElementById('tagManagerModal').classList.remove('open');
            document.body.style.overflow = '';
        }
        document.getElementById('manageTagsBtn').addEventListener('click', openTagManager);
        document.getElementById('tagManagerClose').addEventListener('click', closeTagManager);
        document.getElementById('tagManagerModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeTagManager(); });
        document.getElementById('tagManagerSaveBtn').addEventListener('click', closeTagManager);
        document.getElementById('addTagBtn').addEventListener('click', () => {
            const input = document.getElementById('newTagInput');
            const val = input.value.trim().toLowerCase();
            if (!val || val === 'todos') { toast('Tag inválida.', 'error'); return; }
            if (state.tags.includes(val)) { toast('Tag já existe.', 'error'); return; }
            state.tags.push(val);
            renderTagManager();
            renderFilters();
            renderGallery();
            saveState();
            input.value = '';
            toast(`Tag "${val}" adicionada.`, 'success');
        });
        document.getElementById('newTagInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('addTagBtn').click(); });

        document.getElementById('newCharBtn').addEventListener('click', () => openForm());
        document.getElementById('searchInput').addEventListener('input', (e) => { state.searchQuery = e.target.value;
            renderGallery(); });
        document.getElementById('editSubtitleBtn').addEventListener('click', () => {
            const newSub = prompt('Editar subtítulo:', state.subtitle);
            if (newSub !== null && newSub.trim()) { state.subtitle = newSub.trim();
                document.getElementById('subtitleDisplay').textContent = state.subtitle;
                saveSubtitle(); }
        });

        function init() {
            loadSubtitle();
            document.getElementById('subtitleDisplay').textContent = state.subtitle;
            loadTags();
            const hasSaved = loadState();
            if (!hasSaved || state.characters.length === 0) {
                state.characters = [];
                const ex1 = createEmptyCharacter();
                ex1.name = 'Kaelen Ashford';
                ex1.age = '27';
                ex1.role = 'protagonista';
                ex1.species = 'Humano';
                ex1.description = 'Um viajante solitário em busca de respostas sobre seu passado.';
                ex1.personality = 'Reservado, observador, leal aos amigos que conquista.';
                ex1.primaryColor = '#e2a654';
                ex1.secondaryColor = '#707088';
                ex1.catchphrases = 'O passado nunca fica enterrado.';
                ex1.past = 'Cresceu em um orfanato, sem memórias de seus pais.';
                ex1.origin = 'Vale das Sombras';
                ex1.objective = 'Descobrir a verdade sobre sua linhagem.';
                ex1.characterArc = 'De um solitário a um líder que abraça seu destino.';
                state.characters.push(ex1);
                const ex2 = createEmptyCharacter();
                ex2.name = 'Seraphine Voss';
                ex2.age = '34';
                ex2.role = 'antagonista';
                ex2.species = 'Elfa das Trevas';
                ex2.description = 'Senhora do Círculo das Sombras, implacável e enigmática.';
                ex2.personality = 'Calculista, fria, mas com um código de honra distorcido.';
                ex2.primaryColor = '#6b2fa0';
                ex2.secondaryColor = '#c0392b';
                ex2.catchphrases = 'A ordem nasce do caos.';
                ex2.past = 'Traída por seu próprio clã, jurou vingança.';
                ex2.objective = 'Ascender ao poder absoluto e reformar o mundo à sua imagem.';
                state.characters.push(ex2);
                const ex3 = createEmptyCharacter();
                ex3.name = 'Mira Solis';
                ex3.age = '22';
                ex3.role = 'aliado';
                ex3.species = 'Humana';
                ex3.description = 'Curandeira e guardiã do conhecimento ancestral.';
                ex3.personality = 'Empática, corajosa, com um senso de humor afiado.';
                ex3.primaryColor = '#1a8a7a';
                ex3.secondaryColor = '#e2a654';
                ex3.catchphrases = 'A cura está na compreensão.';
                ex3.past = 'Treinada desde criança pelos sábios do Templo da Luz.';
                ex3.objective = 'Proteger os segredos que podem curar ou destruir.';
                state.characters.push(ex3);
                saveState();
            }
            const validRoles = state.tags.filter(t => t !== 'todos');
            state.characters.forEach(c => { if (!validRoles.includes(c.role)) c.role = validRoles[0] || 'npc'; });
            renderFilters();
            renderGallery();
        }
        init();
        console.log('📖 Módulo Personagens carregado.');
        console.log(`👥 ${state.characters.length} personagens na bíblia visual.`);
        console.log(`🏷️ Tags: ${state.tags.join(', ')}`);
    </script>
